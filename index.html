/* vandaag in de weekstrook: wit met rode titel, zoals Agenda op iPhone */
.wd2.today,.wk-t .wd2.today{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wk-t .wd2,.wk-t .wd2.today,.wk-t .wd2.we:not(.today){background:var(--bg);box-shadow:none}
.wd2.today .wd2-top b{color:var(--danger)}
.wd2.today .wd2-n,.wd2.today .wd2-free,.wd2.today .wd2-more,.wd2.today .wd2-meal{color:var(--muted)}
.wd2.today .wd2-band{color:var(--ink);background:color-mix(in srgb,var(--evc) 22%,transparent)}
.wd2.today .wd2-dots em{box-shadow:0 0 0 1.5px var(--surface)}
.wd2.today .wd2-meal{border-color:var(--line)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary)}
/* lijsten */
.li{border-color:var(--line)}
.set-note{color:var(--muted)}
/* ===================== Glas-stijl (glassmorphism) — kies bij Instellingen → Weergave ===================== */
html[data-style="glass"]{
  --gl:rgba(255,255,255,.42); --gl-2:rgba(255,255,255,.3); --gl-3:rgba(255,255,255,.58); --gl-b:rgba(255,255,255,.75); --gl-sh:0 10px 30px rgba(40,50,90,.08),0 1px 0 rgba(255,255,255,.6) inset;
  --surface:rgba(255,255,255,.5); --surface-2:rgba(255,255,255,.34); --line:rgba(30,40,80,.08); --ink:#1B2140; --muted:#636B86; --primary:#4F6BED; --bg:transparent;
  --blur:saturate(170%) blur(26px);
}
@media (prefers-color-scheme: dark){html[data-style="glass"]:not([data-theme="light"]){
  --gl:rgba(255,255,255,.08); --gl-2:rgba(255,255,255,.05); --gl-3:rgba(255,255,255,.12); --gl-b:rgba(255,255,255,.14); --gl-sh:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08) inset;
  --surface:rgba(255,255,255,.09); --surface-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1); --ink:#F2F4FF; --muted:#A3A9C4; --primary:#6F84F7}}
html[data-style="glass"][data-theme="dark"]{
  --gl:rgba(255,255,255,.08); --gl-2:rgba(255,255,255,.05); --gl-3:rgba(255,255,255,.12); --gl-b:rgba(255,255,255,.14); --gl-sh:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08) inset;
  --surface:rgba(255,255,255,.09); --surface-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1); --ink:#F2F4FF; --muted:#A3A9C4; --primary:#6F84F7}

/* zachte, rustige achtergrond met wazige kleurvlekken */
html[data-style="glass"]{background:#EEF1FA}
html[data-style="glass"] body{background:transparent!important}
html[data-style="glass"] body::after{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 38% at 8% 6%,rgba(132,156,255,.95),transparent 72%),
    radial-gradient(42% 34% at 96% 14%,rgba(255,160,196,.85),transparent 72%),
    radial-gradient(50% 40% at 84% 92%,rgba(110,214,192,.85),transparent 72%),
    radial-gradient(46% 38% at 4% 82%,rgba(255,205,140,.8),transparent 72%),
    radial-gradient(36% 30% at 52% 48%,rgba(196,170,255,.55),transparent 72%),
    linear-gradient(160deg,#E7ECFF,#F8EEF8 50%,#E6F6F2);
  filter:blur(10px)}
html[data-style="glass"] body::before{background:transparent}
@media (prefers-color-scheme: dark){html[data-style="glass"]:not([data-theme="light"]){background:#0C1022}
  html[data-style="glass"]:not([data-theme="light"]) body::after{background:
    radial-gradient(38% 32% at 12% 8%,rgba(88,104,220,.55),transparent 70%),
    radial-gradient(34% 30% at 92% 18%,rgba(170,70,140,.38),transparent 70%),
    radial-gradient(42% 36% at 78% 88%,rgba(40,150,140,.38),transparent 70%),
    radial-gradient(40% 34% at 8% 78%,rgba(190,120,60,.28),transparent 70%),
    linear-gradient(160deg,#0C1022,#141029 50%,#0B1A1F)}}
html[data-style="glass"][data-theme="dark"]{background:#0C1022}
html[data-style="glass"][data-theme="dark"] body::after{background:
    radial-gradient(38% 32% at 12% 8%,rgba(88,104,220,.55),transparent 70%),
    radial-gradient(34% 30% at 92% 18%,rgba(170,70,140,.38),transparent 70%),
    radial-gradient(42% 36% at 78% 88%,rgba(40,150,140,.38),transparent 70%),
    radial-gradient(40% 34% at 8% 78%,rgba(190,120,60,.28),transparent 70%),
    linear-gradient(160deg,#0C1022,#141029 50%,#0B1A1F)}

/* grote glazen panelen (met blur) */
html[data-style="glass"] .card,html[data-style="glass"] .bt,html[data-style="glass"] .wd2,html[data-style="glass"] .stab[aria-selected="true"],html[data-style="glass"] .mc-up,html[data-style="glass"] .today-btn,html[data-style="glass"] .stock{
  background:var(--gl)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gl-b);box-shadow:var(--gl-sh)!important}
html[data-style="glass"] .card,html[data-style="glass"] .bt{border-radius:22px}
html[data-style="glass"] .wd2{border-radius:18px}
/* balken */
html[data-style="glass"] .top{background:var(--gl-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--gl-b)}
html[data-style="glass"] .nav{background:var(--gl);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--gl-b)}
@media (max-width:899px){html[data-style="glass"] .nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;border:1px solid var(--gl-b);box-shadow:var(--gl-sh);padding-bottom:0}
  html[data-style="glass"] #main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
  html[data-style="glass"] .fab{bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px))}}
html[data-style="glass"] .nav button[aria-current="page"] .pill{background:var(--gl-3)!important;box-shadow:0 0 0 1px var(--gl-b) inset;border-radius:14px;width:52px}
/* kleinere elementen: lichter glas zonder extra blur */
html[data-style="glass"] .mcell,html[data-style="glass"] .wchip,html[data-style="glass"] .rt,html[data-style="glass"] .card .rt,html[data-style="glass"] .wk-t .wd2,html[data-style="glass"] .li.tap,html[data-style="glass"] .ev{
  background:var(--gl-2)!important;border:1px solid var(--gl-b);box-shadow:none!important}
html[data-style="glass"] .ev{background:color-mix(in srgb,var(--evc) 14%,var(--gl-2))!important}
html[data-style="glass"] .mcell{border-radius:14px}
html[data-style="glass"] .mcell.vacd{border:0}
html[data-style="glass"] .mcell.vacd::after{background:var(--gl-3);border:1px solid var(--gl-b)}
html[data-style="glass"] .mcell.vacd::before{background:color-mix(in srgb,var(--vc) 18%,transparent)}
/* knoppen, velden, chips */
html[data-style="glass"] .btn:not(.primary):not(.ghost){background:var(--gl-3);border:1px solid var(--gl-b);color:var(--primary)}
html[data-style="glass"] .btn.primary,html[data-style="glass"] .fab{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 92%,#fff),color-mix(in srgb,var(--primary) 80%,#8B5CF6));color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 30%,transparent)}
html[data-style="glass"] .in,html[data-style="glass"] .chip,html[data-style="glass"] .seg{background:var(--gl-2);border:1px solid var(--gl-b)}
html[data-style="glass"] .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--cc,var(--primary)) 18%,var(--gl-3));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cc,var(--primary)) 70%,transparent)}
html[data-style="glass"] .seg button[aria-pressed="true"]{background:var(--gl-3);box-shadow:0 2px 8px rgba(40,50,90,.08)}
html[data-style="glass"] .icon-btn,html[data-style="glass"] .top .icon-btn{color:var(--ink)}
html[data-style="glass"] .bt-ic{background:var(--gl-3);border:1px solid var(--gl-b)}
html[data-style="glass"] .tag{background:var(--gl-3)}
/* sheets: zwevend glas */
html[data-style="glass"] #sheet .scrim{background:rgba(20,26,50,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html[data-style="glass"] #sheet .panel{background:var(--gl-3);backdrop-filter:saturate(170%) blur(34px);-webkit-backdrop-filter:saturate(170%) blur(34px);border:1px solid var(--gl-b);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(40,50,90,.12)}
@media (min-width:700px){html[data-style="glass"] #sheet .panel{border-radius:28px;margin-bottom:16px}}
html[data-style="glass"] #sheet footer{border-top:1px solid var(--line)}
/* typografie: rustig */
html[data-style="glass"] .hello h1{font-weight:600;letter-spacing:-.035em}
html[data-style="glass"] .wd2.today .wd2-top b,html[data-style="glass"] .day-h .today-tag{color:var(--primary)}
html[data-style="glass"] .day-h .today-tag{background:color-mix(in srgb,var(--primary) 16%,transparent)}
html[data-style="glass"] .mcell.today .n{background:var(--primary)}
html[data-style="glass"] .banner{background:var(--gl);border:1px solid var(--gl-b);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
/* clean: geen kleurvlekken, effen achtergrond */
html[data-style="glass"] body::after{display:none}
html[data-style="glass"]{background:#F1F2F6}
html[data-style="glass"]{--gl:rgba(255,255,255,.72); --gl-2:rgba(255,255,255,.55); --gl-3:rgba(255,255,255,.85)}
@media (prefers-color-scheme: dark){html[data-style="glass"]:not([data-theme="light"]){background:#0E1016;--gl:rgba(255,255,255,.07);--gl-2:rgba(255,255,255,.05);--gl-3:rgba(255,255,255,.1)}}
html[data-style="glass"][data-theme="dark"]{background:#0E1016;--gl:rgba(255,255,255,.07);--gl-2:rgba(255,255,255,.05);--gl-3:rgba(255,255,255,.1)}
@media (prefers-reduced-transparency: reduce){html[data-style="glass"]{--gl:rgba(255,255,255,.92);--gl-2:rgba(255,255,255,.85);--gl-3:rgba(255,255,255,.95)}}
/* ===================== Bauhaus-stijl — kies bij Instellingen → Weergave ===================== */
html[data-style="bauhaus"]{
  --bh-red:#D7301F; --bh-blue:#1D4E9E; --bh-yellow:#F3C11B; --bh-black:#141414; --bh-paper:#F4F0E6;
  --bg:var(--bh-paper); --surface:#FFFFFF; --surface-2:#ECE6D8; --ink:var(--bh-black); --text:var(--ink); --muted:#5E5A52; --line:var(--bh-black);
  --primary:var(--bh-black); --on-primary:#FFFFFF; --danger:var(--bh-red); --ok:#2E7D32; --warn:#C98A00;
  --c-charlotte:#D7301F; --c-ruben:#1D4E9E; --c-nant:#E8A800; --c-abel:#2E7D4F; --c-max:#6B3FA0; --c-all:#141414;
  --f-display:"TBEmoji","Jost","Futura","Century Gothic",system-ui,sans-serif; --f-body:"TBEmoji","Jost","Futura","Century Gothic",system-ui,sans-serif;
  --r:0px; --shadow:none; --bw:2px;
}
@media (prefers-color-scheme: dark){html[data-style="bauhaus"]:not([data-theme="light"]){
  --bh-black:#F4F0E6; --bh-paper:#121212; --bg:#121212; --surface:#1C1C1C; --surface-2:#2A2824; --ink:#F4F0E6; --muted:#B5AFA3; --line:#F4F0E6;
  --primary:#F4F0E6; --on-primary:#121212; --c-all:#F4F0E6}}
html[data-style="bauhaus"][data-theme="dark"]{
  --bh-black:#F4F0E6; --bh-paper:#121212; --bg:#121212; --surface:#1C1C1C; --surface-2:#2A2824; --ink:#F4F0E6; --muted:#B5AFA3; --line:#F4F0E6;
  --primary:#F4F0E6; --on-primary:#121212; --c-all:#F4F0E6}
html[data-style="bauhaus"],html[data-style="bauhaus"] body{background:var(--bg)}
html[data-style="bauhaus"] body{letter-spacing:0}
html[data-style="bauhaus"] h1,html[data-style="bauhaus"] h2,html[data-style="bauhaus"] h3{font-weight:600;letter-spacing:.01em}
/* kop: zwart blok met geometrisch logo */
html[data-style="bauhaus"] .top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:var(--bw) solid var(--line)}
html[data-style="bauhaus"] .brand{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:16px}
html[data-style="bauhaus"] .brand .dots{gap:4px}
html[data-style="bauhaus"] .brand .dots i{width:11px;height:11px;border-radius:0}
/* vijf vormen, één per gezinslid, in de kleur van die persoon */
html[data-style="bauhaus"] .brand .dots{align-items:center}
html[data-style="bauhaus"] .brand .dots i{background:var(--mc)}
html[data-style="bauhaus"] .brand .dots i:nth-child(1){border-radius:50%}
html[data-style="bauhaus"] .brand .dots i:nth-child(3){background:transparent;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--mc)}
html[data-style="bauhaus"] .brand .dots i:nth-child(4){width:12px;height:6px;border-radius:12px 12px 0 0;align-self:center}
html[data-style="bauhaus"] .brand .dots i:nth-child(5){width:12px;height:12px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
/* grote titels: strak, hoofdletters */
html[data-style="bauhaus"] .hello h1{font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(28px,7vw,40px);line-height:1}
html[data-style="bauhaus"] .hello h1 em{color:var(--bh-red)}
html[data-style="bauhaus"] .hello .date{text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;font-weight:500;margin-top:8px}
html[data-style="bauhaus"] .hello{border-left:10px solid var(--bh-yellow);padding-left:14px;margin-left:-2px}
/* kaarten: hoekig met zwarte lijn */
html[data-style="bauhaus"] .card,html[data-style="bauhaus"] .bt,html[data-style="bauhaus"] .wd2,html[data-style="bauhaus"] .stock{border-radius:0!important;border:var(--bw) solid var(--line);box-shadow:none!important;background:var(--surface)}
html[data-style="bauhaus"] .bt{animation:none}

html[data-style="bauhaus"] .bt-l{text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:600}
html[data-style="bauhaus"] .warn-t{border-top:10px solid var(--bh-red)}

html[data-style="bauhaus"] .wchip.hi{border-left-color:var(--bh-red)}
html[data-style="bauhaus"] .tag{border-radius:0;background:var(--bh-yellow);color:#141414}

/* weekstrook */
html[data-style="bauhaus"] .wd2,html[data-style="bauhaus"] .wk-t .wd2{background:var(--surface);border-width:var(--bw)}
html[data-style="bauhaus"] .wd2.today,html[data-style="bauhaus"] .wk-t .wd2.today{background:var(--bh-yellow);color:#141414}
html[data-style="bauhaus"] .wd2.today .wd2-top b{color:#141414}
html[data-style="bauhaus"] .wd2.today .wd2-n,html[data-style="bauhaus"] .wd2.today .wd2-free,html[data-style="bauhaus"] .wd2.today .wd2-meal{color:#3a3320}
html[data-style="bauhaus"] .wd2-top b,html[data-style="bauhaus"] .wk2-h h2{text-transform:uppercase;letter-spacing:.06em}
html[data-style="bauhaus"] .wd2-dots em{border-radius:50%}
/* knoppen: rechthoekig, zwart; actie = rode cirkel */
html[data-style="bauhaus"] .btn{border-radius:0;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
html[data-style="bauhaus"] .btn:not(.primary):not(.ghost):not(.danger){background:transparent;color:var(--ink);box-shadow:inset 0 0 0 var(--bw) var(--line)}

/* tabbalk: zwart blok, actief = gele balk */

<script>
/* ============ Gezin ============ */
const MEMBERS=[
  {id:'charlotte',name:'Charlotte',label:'Mama',role:'parent'},
  {id:'ruben',name:'Ruben',label:'Papa',role:'parent'},
  {id:'nant',name:'Nant',role:'kid',born:'2017-04-14'},
  {id:'abel',name:'Abel',role:'kid',born:'2021-07-27'},
  {id:'max',name:'Max',role:'baby',born:'2025-03-03'},
];
const MID=Object.fromEntries(MEMBERS.map(m=>[m.id,m]));
const ALL=MEMBERS.map(m=>m.id), PARENTS=['charlotte','ruben'], SCHOOLKIDS=['nant','abel'];
const col=id=>`var(--c-${id})`;

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>iso(new Date());
const monday=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7))};
const DAYS=['zo','ma','di','wo','do','vr','za'], DAYSL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'], MONL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const dshort=s=>{const d=parse(s);return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};

async function initStore(){
  let db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(db){
    DB=db; mode='db';
    COLS.forEach(c=>{
      let q=db.collection(c);
      if(c==='notifs') q=q.orderBy('at','desc').limit(60);
      q.onSnapshot(snap=>{ S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); onData(c); },
        err=>{ console.warn('db',c,err); if(err&&err.code==='revoked'){ toast('Toegang tot de gedeelde gegevens is ingetrokken.'); } });
    });
  } else {
    mode='local';
    const data=ls.get(LKEY,{}); COLS.forEach(c=>S[c]=data[c]||[]);
    if(typeof wxFromDb==='function') wxFromDb();
    render();
  }
}
function saveLocal(){ const o={}; COLS.forEach(c=>o[c]=S[c]); ls.set(LKEY,o); }
function failed(e){ console.warn(e); toast(e&&e.code==='invalid_argument'?'Opslaan lukte niet: je hebt geen schrijfrechten op deze pagina.':e&&e.code==='quota_exceeded'?'De opslag is vol. Ruim oude items op.':'Opslaan lukte niet. Probeer het opnieuw.'); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function add(c,data){
  data=Object.assign({by:me,at:Date.now()},data);
  try{
    if(mode==='db'){ const ref=DB.collection(c).doc(); await ref.set(data); return ref.id; }
    const id=uid(); S[c]=[Object.assign({id},data),...S[c]]; saveLocal(); onData(c); return id;
  }catch(e){ failed(e); }
}
async function upd(c,id,patch){
  try{
    if(mode==='db') return await DB.collection(c).doc(id).update(patch);
    S[c]=S[c].map(x=>x.id===id?Object.assign({},x,patch):x); saveLocal(); onData(c);
  }catch(e){ failed(e); }
}
async function put(c,id,data){
  try{
    if(mode==='db') return await DB.collection(c).doc(id).set(data);
    S[c]=[Object.assign({id},data),...S[c].filter(x=>x.id!==id)]; saveLocal(); onData(c);
  }catch(e){ failed(e); }
}
async function del(c,id){
  try{
    if(mode==='db') return await DB.collection(c).doc(id).delete();
    S[c]=S[c].filter(x=>x.id!==id); saveLocal(); onData(c);
  }catch(e){ failed(e); }
}

const allEvents=()=>[...S.events,...birthdays(),...holidayEvents(),...feestdagEvents(),...careEvents()];
function startMatches(ev,s){
  const dd=diffDays(s,ev.date); if(dd<0) return false;
  if(ev.until && s>ev.until) return false;
  if((ev.skip||[]).includes(s)) return false;
  const r=ev.repeat||'none';
  if(r==='none') return dd===0;
  if(r==='weekly') return dd%7===0;
  if(r==='days') return (ev.days||[]).map(Number).includes(parse(s).getDay())&&(!(ev.every>1)||Math.round(diffDays(monday(s),monday(ev.date))/7)%ev.every===0);
  if(r==='2weekly') return dd%14===0;
  const a=parse(s), b=parse(ev.date);
  if(r==='monthly') return a.getDate()===b.getDate();
  if(r==='yearly') return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false;
}

const isPoets=ev=>ev.vastKind==='Hulp'||(ev.vastKind!=='Andere'&&/poets|kuishulp|schoonmaak/i.test(ev.title||''));
const isWorkSeries=ev=>(ev.type==='Werk'||ev.type==='Crèche'||isPoets(ev)||ev.vast)&&ev.repeat&&ev.repeat!=='none'&&!ev.virtual;
const offTitle=ev=>isPoets(ev)?'Geen '+String(ev.title).toLowerCase():ev.type==='Crèche'?'Thuis':ev.vastKind==='Andere'?ev.title+' gaat niet door':'Congé';
function workOffDay(ev,day){ if(day<ev.date||(ev.until&&day>ev.until)||(ev.skip||[]).includes(day)) return false;
  /* enkel feestdagen en (school)vakanties; in het weekend staat er niets */
  const wd=parse(day).getDay(); if(wd===0||wd===6) return false; return !!feestdag(day)||!!(ev.skipHol&&skipHolOn(ev,day)&&occurs(ev,day)); }
function occurs(ev,day){
  const len=ev.endDate?Math.max(0,diffDays(ev.endDate,ev.date)):0;
  for(let k=0;k<=len;k++){ if(startMatches(ev,addDays(day,-k))) return {k,len}; }
  return null;
}
function eventsOn(day,filter){
  const out=[], offSeen=new Set(allEvents().filter(e=>e&&e.date&&isWorkSeries(e)&&(e.werkX||[]).includes(day)&&workOffDay(e,day)).map(e=>(e.who||[]).join(',')+'|'+e.type));
  const congeOf=(ev,extra)=>Object.assign({},ev,{title:offTitle(ev),start:'',end:'',allDay:true,congeDay:day},extra||{});
  for(const ev of allEvents()){
    if(!ev||!ev.date) continue;
    if(ev.squad&&ev.sel==='nee') continue;
    if(filter && !(ev.who||[]).some(w=>filter.has(w))) continue;
    const o=occurs(ev,day), runs=o&&(!ev.care||careRuns(ev,day))&&!(ev.skipHol&&skipHolOn(ev,day));
    if(isWorkSeries(ev)){
      /* werk: op weekends en feestdagen staat 'Congé', zodat je kan aanduiden dat je toch werkt */
      if((ev.werkX||[]).includes(day)&&workOffDay(ev,day)){ out.push({ev,day,k:0,len:0}); continue; }
      if(workOffDay(ev,day)){ const key=(ev.who||[]).join(',')+'|'+ev.type; if(!offSeen.has(key)){ offSeen.add(key); out.push({ev:congeOf(ev,{offDay:true}),day,k:0,len:0}); } continue; }
      if(runs) out.push({ev:(ev.conge||[]).includes(day)?congeOf(ev):ev,day,...o});
      /* één dag weggehaald ('enkel deze dag' of verwijderd) = ook congé, tenzij er die dag een aparte werk-afspraak staat */
      else if((ev.skip||[]).includes(day)&&startMatches(Object.assign({},ev,{skip:[]}),day)&&!(ev.skipHol&&skipHolOn(ev,day))&&!S.events.some(x=>x.id!==ev.id&&x.type===ev.type&&(x.type!=='Afspraak'||x.title===ev.title)&&x.date===day&&(x.who||[]).some(w=>(ev.who||[]).includes(w))))
        out.push({ev:congeOf(ev,{skipped:true}),day,k:0,len:0});
      continue;
    }
    if(runs) out.push({ev,day,...o});
  }
  for(const ev of wasteEntries(day)){ if(filter && !ev.who.some(w=>filter.has(w))) continue; out.push({ev,day,k:0,len:0}); }
  for(const ev of schoolEntries(day)){ if(filter && !ev.who.some(w=>filter.has(w))) continue; out.push({ev,day,k:0,len:0}); }

function upcomingList(kid){
  const t=today(), seen=new Set(), out=[];
  for(let i=2;i<=60 && out.length<5;i++){
    const d=addDays(t,i);
    for(const o of eventsOn(d,kid?new Set([me]):null)){
      if(o.k!==0||seen.has(o.ev.id)) continue;
      if(o.ev.virtual==='school'||o.ev.virtual==='schoolx'||o.ev.virtual==='waste') continue;
      if(o.ev.virtual||['Vakantie','Feest','Uitstap','Match'].includes(o.ev.type)||!o.ev.repeat||o.ev.repeat==='none'){ seen.add(o.ev.id); out.push(o); }
      if(out.length>=5) break;
    }
  }
  if(!out.length) return '<p class="empty">De komende twee maanden staat er nog niets bijzonders in de agenda.</p>';
  return `<div class="list">${out.map(o=>`<div class="li tap" data-act="ev-edit" data-v="${esc(o.ev.id)}|${o.day}">${avs(o.ev.who)}<div class="main"><div class="t">${esc(evTitle(o.ev,o.day))}</div><div class="s">${dlong(o.day)}</div></div><span class="tag">over ${diffDays(o.day,t)} d</span></div>`).join('')}</div>`;
}

  const tab=ui.foodTab, kid=!isParent(me);

    <div class="seg"><button data-act="food-tab" data-v="lijst" aria-pressed="${tab==='lijst'}">Boodschappen</button><button data-act="food-tab" data-v="voorraad" aria-pressed="${tab==='voorraad'}">Voorraad</button><button data-act="food-tab" data-v="menu" aria-pressed="${tab==='menu'}">Weekmenu</button><button data-act="food-tab" data-v="recepten" aria-pressed="${tab==='recepten'}">Recepten</button><button data-act="food-tab" data-v="school" aria-pressed="${tab==='school'}">Schoolmenu</button></div></div>`;

    <div class="grid g2"><div class="card" style="padding-block:6px">`;
    for(let i=0;i<7;i++){ const d=addDays(s,i), m=mealOf(d), r=m&&m.recipeId&&S.recipes.find(x=>x.id===m.recipeId), pd=parse(d);
      h+=`<div class="menu-day ${d===t?'today':''}"><div class="d"><b>${DAYS[pd.getDay()]}</b><span>${pd.getDate()} ${MON[pd.getMonth()]}</span></div>
      <button class="m ${m?'set':''}" data-act="meal-pick" data-v="${d}">${m?esc(m.title)+(r?`<span class="s">recept · ${r.ingredients?.length||0} ingrediënten</span>`:''):'<span class="muted">+ Kies wat we eten</span>'}</button></div>`; }
    const withRec=[...Array(7)].map((_,i)=>mealOf(addDays(s,i))).filter(m=>m&&m.recipeId&&S.recipes.some(r=>r.id===m.recipeId));
    h+=`</div><div class="stack"><div class="card"><h2 style="font-size:19px;margin-bottom:6px">Boodschappen voor deze week</h2>
      <p class="muted" style="margin:0 0 12px">${withRec.length?`${withRec.length} maaltijd${withRec.length>1?'en':''} met een recept. De ingrediënten komen per winkel op het lijstje; wat er al op staat wordt niet dubbel gezet.`:'Kies maaltijden uit je recepten, dan kan je hun ingrediënten in één tik op het lijstje zetten.'}</p>
      <button class="btn primary" data-act="menu-to-list" ${withRec.length&&!kid?'':'disabled'}>${icon('cart')} Zet ingrediënten op het lijstje</button></div>
      <div class="card"><h2 style="font-size:19px;margin-bottom:6px">Tip</h2><p class="muted" style="margin:0">Het weekmenu staat ook in de agenda, bovenaan elke dag.</p></div></div></div>`;
  } else if(tab==='lijst'){
    h+=renderShop();
  } else if(tab==='school'){
    h+=renderSchoolMenu();
  } else if(tab==='voorraad'){
    h+=renderStock();
  } else {
    h+=`<div class="row" style="margin-bottom:12px"><span class="muted">${S.recipes.length} recepten</span><span class="sp"></span>${kid?'':`<button class="btn primary" data-act="recipe-edit">${icon('plus')} Nieuw recept</button>`}</div>`;
    const RT=[['','Alles'],['vlaams','🇧🇪 Vlaams'],['snel','⚡ Snel (≤30 min)'],['makkelijk','👌 Makkelijk'],['kids','🧒 Kids'],['soep','🥣 Soep'],['zoet','🍮 Zoet & dessert']], tag=ui.recTag||'';

  }
  return h;
}

async function ingredientsToList(recipes){
  let n=0;
  for(const r of recipes){
    for(const ing of r.ingredients||[]){
      if(!ing.name) continue;
      const ex=S.shopping.find(x=>!x.done&&x.name.toLowerCase()===ing.name.toLowerCase());
      if(ex){ if(ing.qty && !(ex.qty||'').includes(ing.qty)) await upd('shopping',ex.id,{qty:[ex.qty,ing.qty].filter(Boolean).join(' + ')}); continue; }
      await addItem(ing.name,{qty:ing.qty||'',store:ing.store||curStore(),recipe:r.name}); n++;
    }
  }
  toast(n?`${n} ingrediënt${n>1?'en':''} op het lijstje gezet`:'Alles stond al op het lijstje');
  if(n) log(`zette ${n} ingrediënten op het boodschappenlijstje`,PARENTS,'eten');
}

function libCats(){
  const ov=prodOv(), cu=customItems(), ck=JSON.stringify([setting('products').at||0,setting('customItems').at||0,cu.length,Object.keys(ov).length]);
  if(_libC&&_libC.k===ck) return _libC.v;
  const cats=[{name:'Eigen items',e:'🛒',items:[]},...CATALOG.map(c=>({name:c.name,e:c.e,items:[]}))], byName=Object.fromEntries(cats.map(c=>[c.name,c]));
  for(const c of CATALOG) for(const i of c.items){ const key=i.n.toLowerCase(), o=ov[key]||{}; if(o.hidden) continue;
    (byName[o.c]||byName[c.name]).items.push({n:o.n||i.n,e:o.e||i.e,key,custom:false,orig:i.n,oc:c.name}); }
  for(const i of cu){ (byName[i.c]||byName['Eigen items']).items.push({n:i.n,e:i.e||'🛒',key:i.n.toLowerCase(),custom:true}); }
  const v=cats.filter(c=>c.items.length); _libC={k:ck,v}; return v;
}

const fmtNum=n=>Number(n||0).toLocaleString('nl-BE',{maximumFractionDigits:2});
function stockCalc(s){
  const t=today();
  if(s.mode==='interval'){
    const every=Math.max(1,Number(s.everyDays)||7);
    if(!s.lastBought) return {left:0,due:t,frac:0,remaining:null};
    const due=addDays(s.lastBought,every), left=Math.max(0,diffDays(due,t));
    return {left,due,frac:Math.max(0,Math.min(1,left/every)),remaining:null};
  }
  const per=Number(s.perDay)||0, start=Number(s.lastQty)||Number(s.buyQty)||0;
  if(!s.lastBought||!per||!start) return null;
  const use=d=>s.schoolDays?(isSchoolDay(d)?per:0):per;
  let rem=start, d=s.lastBought, i=0;
  while(d<t&&i<730){ rem-=use(d); d=addDays(d,1); i++; }
  rem=Math.max(0,rem);
  let r=rem, left=0; d=t; i=0;
  while(r>0&&i<730){ r-=use(d); if(r>0){left++;d=addDays(d,1)} i++; }
  return {left:rem<=0?0:left,due:addDays(t,rem<=0?0:left),frac:Math.min(1,rem/start),remaining:rem};
}

  const who=(s.forWho||[]).map(w=>MID[w]?.name||stockWho().find(o=>o.v===w)?.l).filter(Boolean);
  if(s.mode==='interval') return `Om de ${s.everyDays||7} dagen${who.length?' · '+who.join(', '):''}`;
  return `${who.length?who.join(' & ')+': ':''}${fmtNum(s.perDay)} ${s.unit} per ${s.schoolDays?'schooldag':'dag'} · koop ${fmtNum(s.buyQty)} ${s.unit}`;
}
function stockWarnings(){
  const dm=dismissed();
  return lowStock().map(({s,c})=>{ const key=`stock|${s.id}|${c.due}`; if(dm.has(key)) return null;
    const when=c.left<=0?(c.remaining>0?'vandaag op':'op'):c.left===1?'morgen op':`nog ${c.left} dagen`;
    return {lvl:c.left<=0?'hi':'mid',key,sid:s.id,left:c.left,when,e:stockEmoji(s),stock:s.name,onList:!!openItem(s.name)}; }).filter(Boolean);
}

async function stockBought(name,qty){

    await upd('stock',s.id,{lastBought:today(),lastQty:s.mode==='interval'?add:((c&&c.remaining)||0)+add,addedFor:''});
  }
}

async function checkStock(){
  if(stockBusy||!me||mode==='connecting') return; stockBusy=true;
  try{
    for(const {s,c} of lowStock()){
      if(s.addedFor===c.due) continue;
      await upd('stock',s.id,{addedFor:c.due});
      const when=c.left===0?'is (bijna) op':c.left===1?'is morgen op':`is over ${c.left} dagen op`;
      if(s.auto!==false && !openItem(s.name)){
        await addItem(s.name,{qty:`${fmtNum(s.buyQty)} ${s.unit}`,store:s.store||curStore(),recipe:''});
        log(`${s.name} ${when}. Ik zette het op het boodschappenlijstje.`,PARENTS,'voorraad','auto');
      } else {
        log(`${s.name} ${when}.`,PARENTS,'voorraad','auto');
      }
    }

}

function choreState(c){
  const t=today(), every=Math.max(1,Number(c.everyDays)||7);
  if(c.snoozeTo && c.snoozeTo>t) return {due:false,daysTo:diffDays(c.snoozeTo,t),fresh:1,snoozed:true,next:c.snoozeTo};
  if(!c.lastDone) return {due:true,waiting:0,fresh:0,next:t};
  const next=addDays(c.lastDone,every), n=diffDays(next,t);
  return {due:n<=0,daysTo:n,waiting:Math.max(0,-n),fresh:Math.max(0,Math.min(1,n/every)),next};
}

function dayTimeline(evs){
  const timed=evs.filter(o=>!o.ev.allDay&&o.ev.start), allday=evs.filter(o=>o.ev.allDay||!o.ev.start);
  const toM=s=>{const [h,m]=(s||'0:0').split(':').map(Number);return h*60+m};
  const H0=7*60, H1=22*60, span=H1-H0;
  const rows=[]; timed.sort((a,b)=>toM(a.ev.start)-toM(b.ev.start)).forEach(o=>{
    const s=toM(o.ev.start), e=Math.max(s+30,o.ev.end?toM(o.ev.end):s+60);
    let r=rows.findIndex(end=>end<=s); if(r<0){r=rows.length;rows.push(0)} rows[r]=e; o._s=s;o._e=e;o._r=r; });
  const now=new Date(), nm_=now.getHours()*60+now.getMinutes(), np=(nm_-H0)/span*100;
  let h='';
  if(allday.length) h+=`<div class="ad-row">${allday.map(o=>`<button class="ad" style="--evc:${evColor(o.ev)}" data-act="ev-edit" data-v="${esc(o.ev.id)}|${o.day}">${isBd(o.ev)?'🎂':o.ev.type==='Match'||o.ev.type==='Training'?sportOf(o.ev).e:(EV_EMO[o.ev.type]||'')} ${esc(evTitle(o.ev,o.day))}</button>`).join('')}</div>`;

    <div class="tl-track">${timed.map(o=>{const l=Math.max(0,(o._s-H0)/span*100), w=Math.max(4,(Math.min(H1,o._e)-Math.max(H0,o._s))/span*100);
      return `<button class="tl-ev ${o._e<=nm_?'past':''}" style="--evc:${evColor(o.ev)};left:${l}%;width:${w}%;top:calc(${o._r} * 46px)" data-act="ev-edit" data-v="${esc(o.ev.id)}|${o.day}" title="${esc(o.ev.start)} ${esc(o.ev.title)}"><b>${esc(o.ev.start)}</b> ${esc(o.ev.title)}</button>`}).join('')}
      ${np>=0&&np<=100?`<span class="tl-now" style="left:${np}%"><i>nu</i></span>`:''}</div>
  </div></div>`;
  return h;
}

let sw=null, swSuppress=false;
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest('[data-swipe]'); if(!row||e.button>0) return;
  sw={row,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.on){ if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){sw=null;return} if(Math.abs(dx)<10) return; sw.on=true; sw.row.classList.add('swiping'); try{sw.row.setPointerCapture(e.pointerId)}catch(_){} }
  sw.dx=Math.max(-140,Math.min(140,dx));
  sw.row.style.setProperty('--dx',sw.dx+'px');
  sw.row.classList.toggle('sw-r',sw.dx>70); sw.row.classList.toggle('sw-l',sw.dx<-70);
});
function swEnd(){
  if(!sw) return; const {row,dx,on}=sw; sw=null; if(!on) return;
  swSuppress=true; setTimeout(()=>swSuppress=false,60);
  row.classList.remove('swiping');
  const [ra,la]=[row.dataset.swipe,row.dataset.swipeLeft];
  if(dx>70&&ra){ row.style.setProperty('--dx','110%'); vib(15); setTimeout(()=>{const [a,v]=ra.split('|');ACT[a]&&ACT[a](v,row)},180); }
  else if(dx<-70&&la){ row.style.setProperty('--dx','-110%'); vib([10,40,10]); setTimeout(()=>{const [a,v]=la.split('|');ACT[a]&&ACT[a](v,row)},180); }
  else { row.style.setProperty('--dx','0px'); }
  row.classList.remove('sw-r','sw-l');
}
document.addEventListener('pointerup',swEnd); document.addEventListener('pointercancel',()=>{ if(sw){sw.row.style.setProperty('--dx','0px');sw.row.classList.remove('swiping','sw-r','sw-l');sw=null} });

/* alle feestdagen in België: de 10 wettelijke (vrije dagen) + Pasen, Pinksteren en de gekende gezinsfeestdagen */
let _fdCache=null;
function feestdagEvents(){
  const y0=new Date().getFullYear(); if(_fdCache&&_fdCache.y===y0) return _fdCache.list;
  const out=[], hol=new Set(HOLIDAYS.filter(h=>!h[2]).map(h=>h[1]));

  for(let y=y0-1;y<=y0+2;y++){
    const e=easter(y), L=[
      [`${y}-01-01`,'Nieuwjaar',1],[addDays(e,1),'Paasmaandag',1],[`${y}-05-01`,'Dag van de Arbeid',1],[addDays(e,39),'O.-H.-Hemelvaart',1],
      [addDays(e,50),'Pinkstermaandag',1],[`${y}-07-21`,'Nationale feestdag',1],[`${y}-08-15`,'O.-L.-V.-Hemelvaart',1],[`${y}-11-01`,'Allerheiligen',1],
      [`${y}-11-11`,'Wapenstilstand',1],[`${y}-12-25`,'Kerstmis',1],
      [e,'Pasen',0],[addDays(e,49),'Pinksteren',0],[`${y}-07-11`,'Feest van de Vlaamse Gemeenschap',0],[`${y}-01-06`,'Driekoningen',0],
      [`${y}-02-14`,'Valentijn',0],[nthSun(y,5,2),'Moederdag',0],[nthSun(y,6,2),'Vaderdag',0],[`${y}-10-31`,'Halloween',0],
      [`${y}-11-02`,'Allerzielen',0],[`${y}-12-06`,'Sinterklaas',0],[`${y}-12-24`,'Kerstavond',0],[`${y}-12-26`,'Tweede kerstdag',0],[`${y}-12-31`,'Oudejaarsavond',0]];
    for(const [d,t,legal] of L){ if(legal&&hol.has(d)) continue;
      out.push({id:'fd-'+d+'-'+t.length,virtual:'holiday',fd:legal?'wettelijk':'feest',title:t,who:[...ALL],date:d,endDate:'',repeat:'none',allDay:true,type:legal?'Vrij':'Feest'}); }
  }

    const key=i.start+'|'+i.end+'|'+(i.exc?i.exc.id:''); (groups[key]=groups[key]||{i,kids:[]}).kids.push(k);

function rules(){

WAARSCHUW bij conflicten: twee ouders tegelijk weg terwijl kinderen thuis zijn (babysit/opvang nodig), iemand op twee plaatsen tegelijk, te weinig reistijd tussen twee plaatsen (bv. match om 11u in Gent en om 14u terug voor de scouts: tel speelduur + reistijd), een kind dat gebracht/gehaald moet worden terwijl beide ouders bezet zijn. Controleer dit ook bij een nieuw voorstel voor een afspraak, en stel een oplossing voor.
DENK MEE als een attente gezinsplanner: beantwoord eerst de vraag, en kijk dan logisch wat nog nuttig is. Bijvoorbeeld: overlappende afspraken of wie de kinderen brengt/haalt als beide ouders bezet zijn, geen school (opvang?), iets mee te nemen (notities), verzameluur en vertrektijd bij uitmatchen, het weer bij iets buiten, afval dat de avond voordien buiten moet, verjaardagen (cadeau?), geen eten gepland, voorraad die bijna op is, deadlines die naderen. Geef hooguit 2 à 3 korte suggesties onder "Om aan te denken", alleen als ze echt relevant zijn.
HANDELINGEN: als de gebruiker iets wil laten doen, of als een suggestie een duidelijke actie heeft, gebruik de propose_* tools. Die voeren NIETS uit: de gebruiker ziet een kaart en bevestigt zelf. Zeg dan kort "Bevestig hieronder". Doe geen acties zonder dat het nuttig of gevraagd is.
WEER: je krijgt hieronder de echte AccuWeather-verwachting (indien beschikbaar); gebruik die bij buitenactiviteiten, matchen, trainingen, uitstappen (regenjas, warm aankleden, verplaatsen?). 
EXTERNE LINKS: gebruik open_link voor route naar een adres of locatie van een afspraak, weersvoorspelling, buienradar, verkeersinfo, of een zoekopdracht (openingsuren, storingen, wegenwerken, info over een plaats). Je kan zelf geen websites lezen: verwijs ernaar met een knop en verzin geen weersvoorspelling of verkeerssituatie.
"Vrij" betekent: geen afspraken voor die persoon op dat moment (school telt als bezet tijdens schooluren; hele-dag-vakanties van de kinderen maken ouders niet bezet). Noem bij een vrij-vraag wat er die dag wel gepland staat. Interpreteer "ik"/"mij" als ${nm(me)}. Relatieve dagen ("zaterdag", "volgende week") reken je vanaf vandaag.
Als je uitlegt waar iets zit in de app, of de gebruiker wil iets bekijken of instellen, gebruik show_link. Gebruik geen tabellen of koppen (behalve "**Om aan te denken**"); opsommingen met "- " mogen; vet (**) spaarzaam.

${APP_GUIDE}

GEGEVENS:
${stateDump()}`;
}

const claudeOn=()=>!!SAMPLE&&SAMPLE_OK&&prefs().claude!==false;
let SAMPLE_OK=true;
async function claudeAsk(bot){
  const ctl=new AbortController(); chat.ctl=ctl;
  const hist=chat.turns.filter(t=>t!==bot&&t.content&&!t.err).slice(-10);
  while(hist.length&&hist[0].role!=='user') hist.shift();
  while(hist.length&&hist[hist.length-1].role!=='user') hist.pop();
  const input=[{role:'user',content:rules()+(chat.intro?'\n\nJe opende dit gesprek zelf met dit overzicht (de gebruiker zag het; als die bv. "ja" antwoordt, slaat dat hierop):\n'+chat.intro:'')},...hist];
  bot.content=''; bot.claude=true; drawChat();
  try{
    const opts={signal:ctl.signal,modelTier:'default',onText:({text})=>{bot.content=text;if(!chat.raf)chat.raf=requestAnimationFrame(()=>{chat.raf=0;drawChat()})}};
    if(SAMPLE_TOOLS) opts.tools=chatTools(); else opts.cache=false;
    const r=await SAMPLE(input,opts);
    bot.content=r.text.trim()+(r.truncated?'\n(ingekort)':'');
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled') bot.content=(e.text||'').trim()||'Gestopt.';
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ bot.content='Jonah mag Claude hier niet gebruiken. Je kan het toestaan via het menu van deze pagina, of het uitzetten bij Instellingen → Weergave.'; bot.err=true; SAMPLE_OK=false; }
    else if(code==='rate_limited'){ bot.content=(e.text?e.text+'\n\n':'')+'Even te veel vragen na elkaar. Probeer het straks opnieuw.'; bot.err=true; }
    else { bot.content=(e&&e.text?e.text+'\n\n':'')+'Jonah kon even niet antwoorden. Probeer het nog eens.'; bot.err=true; }
  }finally{ chat.ctl=null; }
}

function parseDates(q){
  const t=today();
  if(has(q,'vandaag','vanavond','vanmiddag','vannamiddag','vanmorgen','straks','nu')) return {from:t,days:1,label:'vandaag'};
  if(has(q,'overmorgen')) return {from:addDays(t,2),days:1,label:'overmorgen'};
  if(has(q,'morgen','morgenavond','morgenvroeg','morgennamiddag')) return {from:addDays(t,1),days:1,label:'morgen'};
  if(hasPart(q,'weekend')){ const wd=parse(t).getDay(); let sat=wd===6?t:wd===0?addDays(t,-1):addDays(t,6-wd); const nxt=hasPart(q,'volgend'); if(nxt) sat=addDays(sat,7); const from=sat<t?t:sat; return {from,days:diffDays(addDays(sat,1),from)+1,label:nxt?'volgend weekend':'dit weekend'}; }
  if(hasPart(q,'volgende week')) { const m=addDays(monday(t),7); return {from:m,days:7,label:'volgende week'}; }
  if(hasPart(q,'deze week')||has(q,'week')) return {from:t,days:7,label:'de komende 7 dagen'};
  if(hasPart(q,'volgende maand')){ const d=parse(t); const a=iso(new Date(d.getFullYear(),d.getMonth()+1,1)), b=iso(new Date(d.getFullYear(),d.getMonth()+2,0)); return {from:a,days:diffDays(b,a)+1,label:MONL[parse(a).getMonth()]}; }
  let m=q.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/);
  if(m){ let y=m[3]?Number(m[3].length===2?'20'+m[3]:m[3]):parse(t).getFullYear(); let d=iso(new Date(y,Number(m[2])-1,Number(m[1]))); if(!m[3]&&d<t) d=iso(new Date(y+1,Number(m[2])-1,Number(m[1]))); return {from:d,days:1,label:dlong(d)}; }
  m=q.match(/(\d{1,2}) (januari|jan|februari|feb|maart|mrt|april|apr|mei|juni|jun|juli|jul|augustus|aug|september|sept|sep|oktober|okt|november|nov|december|dec)\b/);
  if(m){ const y=parse(t).getFullYear(); let d=iso(new Date(y,MONN[m[2]],Number(m[1]))); if(d<t) d=iso(new Date(y+1,MONN[m[2]],Number(m[1]))); return {from:d,days:1,label:dlong(d)}; }
  for(const [w,n] of Object.entries(WDN)){ if(w.length<3) continue; if(new RegExp('(^| )'+w+'(avond|middag|namiddag|morgen|voormiddag)?( |$)').test(q)){ let k=(n-parse(t).getDay()+7)%7; if(k===0&&has(q,'volgende')) k=7; return {from:addDays(t,k),days:1,label:k===0?'vandaag':dlong(addDays(t,k))}; } }
  return null;
}

function insights(from,days,ppl){
  const t=today(), out=[], links=[]; let weatherAdded=false;
  const toM=s=>{const [h,m]=(s||'0:0').split(':').map(Number);return h*60+m};
  for(let i=0;i<Math.min(days,7);i++){
    const d=addDays(from,i), evs=eventsOn(d), dn=i===0&&from===t?'vandaag':diffDays(d,t)===1?'morgen':DAYSL[parse(d).getDay()];
    for(const c of conflictsOn(d)){ if(ppl&&ppl.length&&!/babysit|bezet/.test(c.text)&&!ppl.some(p=>c.text.includes(nm(p)))) continue; out.unshift('⚠️ '+c.text); (c.links||[]).forEach(l=>links.push(l)); }
    for(const o of evs){ const ev=o.ev; if(ppl&&ppl.length&&!(ev.who||[]).some(w=>ppl.includes(w))) continue;
      if(ev.type==='Match'&&ev.homeAway==='uit'){ out.push(`🚗 ${evTitle(ev,d)} ${dn}: ${ev.meet?'verzamelen om '+ev.meet:'vertrek op tijd'}${ev.place?', in '+ev.place:''}.`); if(ev.place) links.push(extLink.route(ev.place,'Route naar '+ev.place)); }
      if(ev.place&&!ev.virtual&&ev.type!=='Match'&&(ev.type==='Uitstap'||ev.type==='Afspraak')&&(!ev.repeat||ev.repeat==='none')&&o.k===0&&diffDays(d,t)<=3) links.push(extLink.route(ev.place,'Route: '+ev.title));
      if(OUTDOOR(ev)&&!weatherAdded&&diffDays(d,t)<=10&&WX.daily&&wxForEv(ev,d)){ weatherAdded=true; const w=wxForEv(ev,d); out.push(`${w.e} ${dn[0].toUpperCase()+dn.slice(1)} **${ev.title}**${ev.start&&!ev.allDay?' om '+ev.start:''}: ${w.t}°, ${String(w.txt).toLowerCase()}, ${w.rain}% kans op regen${w.gust>=50?`, windstoten ${w.gust} km/u`:''}.${w.rain>=50?' Regenjas mee!':w.t<=4?' Warm aankleden.':''}`); }
      else if(OUTDOOR(ev)&&!weatherAdded&&diffDays(d,t)<=10){ weatherAdded=true; out.push(`🌦️ ${dn[0].toUpperCase()+dn.slice(1)} staat **${ev.title}** gepland, dat is buiten. Kijk even naar het weer.`); links.push(extLink.weer(homeTown())); }
      if(ev.note&&o.k===0&&diffDays(d,t)<=2&&!ev.virtual) out.push(`🎒 Niet vergeten bij ${ev.title}: ${ev.note}.`);
      if(ev.virtual==='schoolx') out.push(`🎈 ${dn[0].toUpperCase()+dn.slice(1)}: ${ev.title.toLowerCase()} voor ${names(ev.who)}. Opvang nodig?`);
    }
    if(diffDays(d,t)>=0&&diffDays(d,t)<=3&&!mealOf(d)&&isParent(me)) { out.push(`🍽️ Voor ${dn} is er nog geen eten gepland.`); links.push(link('menu')); }
    const w=wasteOn(addDays(d,1)); if(w&&isParent(me)&&diffDays(d,t)<=2) out.push(`🗑️ ${dn[0].toUpperCase()+dn.slice(1)}avond ${w.types.map(x=>WASTE[x]?.l||x).join(' + ')} buitenzetten.`);
  }
  MEMBERS.filter(m=>m.born).forEach(m=>{ const b=parse(m.born); let d=iso(new Date(parse(t).getFullYear(),b.getMonth(),b.getDate())); if(d<t) d=iso(new Date(parse(t).getFullYear()+1,b.getMonth(),b.getDate())); const k=diffDays(d,t); if(k>=0&&k<=10) out.push(`🎂 ${m.name} verjaart ${k===0?'vandaag':k===1?'morgen':'over '+k+' dagen'}${k>2?'. Al een cadeautje?':'!'}`); });
  if(isParent(me)){ const low=lowStock().filter(({s})=>!openItem(s.name)); if(low.length) out.push(`🥛 Bijna op en nog niet op het lijstje: ${low.map(({s})=>s.name).join(', ')}.`); }
  const seen=new Set(); return {lines:[...new Set(out)].slice(0,6),links:links.filter(l=>{const k=l.url||l.k;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4)};
}
function withInsights(res,from,days,ppl){

  shopping:(items)=>proposal('Op het boodschappenlijstje',items.map(x=>x.name+(x.qty?' ('+x.qty+')':'')).join(', '),async()=>{const done=[];for(const it of items){const nmx=(it.name[0]||'').toUpperCase()+it.name.slice(1);if(openItem(nmx))continue;await addItem(nmx,it.qty?{qty:it.qty}:{});done.push(nmx)}return done.length?`Toegevoegd: ${done.join(', ')}`:'Stond er al op'}),
  task:(title,hi,due)=>proposal('Klusje toevoegen',`${hi?'🔴 ':''}${title}${due?' · tegen '+dshort(due):''}`,async()=>{await add('tasks',{title,who:'samen',done:false,due:due||'',prio:hi?'hoog':'normaal'});log(`zette "${title}" op het klusjesbord`,PARENTS,'taak');return 'Op het klusjesbord gezet'}),
  admin:(title,hi,due)=>proposal('Te regelen toevoegen',`${hi?'🔴 ':''}${title}${due?' · deadline '+dshort(due):''}`,async()=>{await add('admin',{title,cat:'Administratie',who:'samen',due:due||'',note:'',done:false,prio:hi?'hoog':'normaal'});log(`zette "${title}" bij te regelen`,PARENTS,'regelen');return 'Bij te regelen gezet'}),
  event:(ev)=>proposal('Afspraak in de agenda',`${ev.title} · ${dlong(ev.date)}${ev.start?' om '+ev.start+(ev.end?'–'+ev.end:''):' (hele dag)'}${ev.who.length?' · '+names(ev.who):''}${ev.place?' · '+ev.place:''}`,async()=>{await add('events',ev);log(`zette "${evTitle(ev,ev.date)}" in de agenda voor ${names(ev.who)} (${relDay(ev.date)})`,[...new Set([...ev.who,...PARENTS])],'agenda');return 'In de agenda gezet'},()=>{closeSheet();eventSheet(null,ev.date,ev)}),
  reminder:(r)=>proposal('Herinnering',`🔔 ${r.title} · ${dlong(r.date)}${r.time?' om '+r.time:' (8u)'}${r.who.length&&!(r.who.length===1&&r.who[0]===me)?' · voor '+names(r.who):''}`,async()=>{await add('reminders',Object.assign({done:false},r));if(r.who.some(w=>w!==me))log(`zette een herinnering "${r.title}" (${relDay(r.date)}${r.time?' '+r.time:''})`,r.who.filter(w=>w!==me),'agenda');return 'Herinnering gezet 🔔'},()=>{closeSheet();reminderSheet(null,r.date,r)}),
  meal:(date,title)=>proposal('Weekmenu',`${dlong(date)}: ${title}`,async()=>{const r=S.recipes.find(x=>norm(x.name)===norm(title));await put('meals',date,{title:r?r.name:title,recipeId:r?r.id:'',by:me,at:Date.now()});return 'In het weekmenu gezet'}),
  done:(kind,item)=>proposal('Afvinken',`${item.title}`,async()=>{ if(kind==='task'){await upd('tasks',item.id,{done:true,doneBy:me,doneAt:Date.now()});} else if(kind==='admin'){await upd('admin',item.id,{done:true,doneBy:me,doneAt:Date.now()});} else { await upd('chores',item.id,{lastDone:today(),doneBy:me,snoozeTo:''}); await add('chorelog',{choreId:item.id,title:item.title}); } log(`vinkte "${item.title}" af`,PARENTS,'taak'); return 'Afgevinkt ✓'}),
  schooloff:(date,kids,reason)=>proposal('Geen school',`${dlong(date)} · ${names(kids)} · ${reason}`,async()=>{await add('schoolx',{date,kids,kind:'vrij',title:reason,start:'',end:''});log(`zette ${dshort(date)} als "${reason}" voor ${names(kids)}: geen school`,[...new Set([...kids,...PARENTS])],'school');return 'Uitzondering bewaard'}),
  machine:(label,min)=>proposal('Machine starten',`${label} · ${fmtMin(min)} · klaar om ${hhmm(Date.now()+min*6e4)}`,async()=>{await add('timers',{label,minutes:min,startedAt:Date.now()});log(`zette de ${label.toLowerCase()} aan, klaar om ${hhmm(Date.now()+min*6e4)}`,PARENTS,'machine');return 'Timer loopt'}),
};
function findByTitle(list,title){ const q=norm(title); return list.find(x=>norm(x.title)===q)||list.find(x=>norm(x.title).includes(q))||list.find(x=>q.includes(norm(x.title))); }

function helpFor(q){
  let best=null, score=0;
  for(const h of HELP){ const s=h.k.reduce((n,k)=>n+(q.includes(k)?k.length:0),0); if(s>score){score=s;best=h} }
  return best;
}

/* --- vraag beantwoorden --- */
function answer(raw){
  const q=norm(raw), t=today(), par=isParent(me), links=[];
  const R=(text,ls)=>({text,links:(ls||[]).map(x=>typeof x==='string'?link(x):x)});
  const howTo=has(q,'hoe','waar','kan ik')&&!hasPart(q,'geraak','rijd','route','navigeer','kom ik','waar is','weer')&&!has(q,'vrij','wanneer')&&!hasPart(q,'wat moet ik nog','wat moet ik regelen');
  if(howTo){ const h=helpFor(q); if(h) return R(h.a,h.l); }

  /* toevoegen aan lijstje */
  let m=q.match(/^(?:zet|doe|voeg|schrijf)\s+(.+?)\s+(?:op|bij|aan|toe aan)\s+(?:het |de |mijn )?(?:boodschappen ?lijst(?:je)?|lijst(?:je)?|boodschappen)(?: toe)?$/)||q.match(/^(?:we hebben|ik heb|er is)\s+(?:geen|nog)\s+(.+?)\s+(?:meer|nodig)$/)||(!/^(wat|welke|hoeveel|staat|staan|is|zijn|wie|hoe|waar|wanneer)\b/.test(q)&&q.match(/^(.+?)\s+(?:op|bij) (?:het |de )?(?:lijstje|lijst|boodschappen)$/));
  if(m){ const items=m[1].split(/,| en | & /).map(s=>s.replace(/^(nog |wat |een |de |het |extra )+/,'').trim()).filter(Boolean).slice(0,15);
    const lib=libFlat().map(i=>i.n);
    const named=items.map(it=>lib.find(n=>n.toLowerCase()===it)||it[0].toUpperCase()+it.slice(1));
    const dup=named.filter(n=>openItem(n)), fresh=named.filter(n=>!openItem(n));
    if(!fresh.length) return R(`${dup.join(', ')} ${dup.length>1?'staan':'staat'} al op het lijstje.`,['boodschappen']);
    const res=R(`Zal ik **${fresh.join(', ')}** op het lijstje zetten?${dup.length?` (${dup.join(', ')} ${dup.length>1?'staan':'staat'} er al op.)`:''}`,['boodschappen']);
    res.actions=[P_ACT.shopping(fresh.map(n=>({name:n})))];
    const low=lowStock().filter(({s})=>!openItem(s.name)&&!fresh.some(n=>norm(n)===norm(s.name)));
    if(low.length){ res.text+=`\n\n💡 Ook bijna op: ${low.map(({s})=>s.name).join(', ')}.`; res.actions.push(P_ACT.shopping(low.map(({s})=>({name:s.name,qty:`${fmtNum(s.buyQty)} ${s.unit}`})))); }
    return res; }
  /* herinnering */
  m=q.match(/^(?:herinner|help herinneren|laat)\s+(?:me|mij|ons|\w+)?\s*(?:eraan|er aan|weten)?\s*(?:om|dat|aan)?\s*(.+)$/);
  if(m&&/^(herinner|laat .*weten)/.test(q)){ const pd=parseDates(q), d=pd?pd.from:t; const tm=raw.toLowerCase().match(/(?:om|rond)\s+(\d{1,2})(?:[:u.h](\d{2}))?\s*(?:u|uur)?\b/); const time=tm?`${String(tm[1]).padStart(2,'0')}:${tm[2]||'00'}`:'';
    let title=raw.replace(/^\s*(herinner|laat)\s+(me|mij|ons)?\s*(eraan|er aan|weten)?\s*(om|dat|aan)?\s*/i,'').replace(/\b(vandaag|morgen|overmorgen|volgende week|(op )?(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag))\b/ig,'').replace(/\b(om|rond)\s+\d{1,2}([:u.h]\d{2})?\s*(u|uur)?\b/ig,'').replace(/\s+/g,' ').replace(/[?.!]+$/,'').trim().replace(/^(aan|om|dat|eraan|er aan)\s+/i,'');
    if(!title) title='Herinnering'; title=title[0].toUpperCase()+title.slice(1);
    const who=has(q,'ons')&&par?[...PARENTS]:[me];
    const res=R(`Zal ik je **${relDay(d)}${time?' om '+time:' om 8u'}** herinneren aan **${title}**?`,[]); res.actions=[P_ACT.reminder({title,date:d,time,who})]; return res; }
  /* klusje toevoegen */
  m=q.match(/^(?:zet|voeg)\s+(.+?)\s+(?:bij|op|aan)\s+(?:de |het )?(?:klusjes|klusjesbord|taken|takenlijst)(?: toe)?$/);
  if(m){ if(!par) return R('Klusjes toevoegen kunnen alleen mama en papa.'); const title=raw.replace(/^\s*(zet|voeg)\s+/i,'').replace(/\s+(bij|op|aan)\s+(de |het )?(klusjes(bord)?|taken(lijst)?)( toe)?\s*[?.!]*$/i,'').trim();
    const hi=/^!/.test(title)||has(q,'belangrijk','dringend'); let tt=title.replace(/^!+\s*/,''); tt=tt[0].toUpperCase()+tt.slice(1);
    const res=R(`Zal ik **${tt}** op het klusjesbord zetten${hi?' als belangrijk':''}?`,['klusjes']); res.actions=[P_ACT.task(tt,hi,'')]; return res; }
  /* machine starten */
  m=q.match(/(?:zet|start|steek)\s+(?:de |het )?(wasmachine|was|droogkast|droger|vaatwas(?:ser|machine)?|oven|[a-z]+machine)\s*(?:aan|op|in)?(?:\s+(?:voor\s+)?(\d+)\s*(min|minuten|u|uur))?/);
  if(m&&par){ const map={was:'Wasmachine',droger:'Droogkast',vaatwas:'Vaatwasser',vaatwasmachine:'Vaatwasser'}; const lbl=map[m[1]]||m[1][0].toUpperCase()+m[1].slice(1); const pre=machines().find(x=>norm(x.l)===norm(lbl)); const min=m[2]?Number(m[2])*(/^u/.test(m[3])?60:1):(pre?pre.m:60);
    const res=R(`Zal ik de timer voor de **${(pre?pre.l:lbl).toLowerCase()}** starten? Klaar om ${hhmm(Date.now()+min*6e4)}.`,['machines']); res.actions=[P_ACT.machine(pre?pre.l:lbl,min)]; return res; }
  /* afvinken */
  m=q.match(/^(?:vink\s+(.+?)\s+af|(.+?)\s+is\s+(?:gedaan|klaar|geregeld|afgewerkt))$/);
  if(m&&par){ const ttl=(m[1]||m[2]).replace(/^(de|het)\s+/,''); for(const [k,list] of [['task',S.tasks.filter(x=>!x.done)],['admin',S.admin.filter(x=>!x.done)],['chore',S.chores]]){ const it=findByTitle(list,ttl); if(it){ const res=R(`Zal ik **${it.title}** afvinken?`,[k==='task'?'klusjes':k==='admin'?'regelen':'ritme']); res.actions=[P_ACT.done(k,it)]; return res; } } }
  /* route / navigatie */
  if(hasPart(q,'route','navigeer','navigatie','hoe rijd','hoe geraak','hoe kom ik','rijden naar','adres van','waar is')){
    let dest=(raw.match(/(?:naar|is)\s+(.+?)[?.!]*$/i)||[])[1]||'';
    if(has(q,'huis','thuis')) dest=homeAddr();
    else if(dest){
      const dq=norm(dest), rp=parsePeople(dq).filter(x=>x!==me||has(dq,'mijn','ik'));
      const typeW=hasPart(dq,'match','wedstrijd')?'Match':hasPart(dq,'training')?'Training':'';
      const kw=dq.split(' ').filter(w=>w.length>3&&!['match','training','wedstrijd','volgende'].includes(w)&&!MEMBERS.some(mm=>norm(mm.name)===w)&&!['mama','papa'].includes(w));
      let hit=null;
      for(let i=0;i<90&&!hit;i++){ const d=addDays(t,i); const o=eventsOn(d).find(o=>{const ev=o.ev; if(ev.virtual) return false; if(rp.length&&!rp.some(p=>(ev.who||[]).includes(p))) return false; if(typeW) return ev.type===typeW; const tx=norm(evTitle(ev,d)+' '+(ev.place||'')); return kw.length&&kw.some(w=>tx.includes(w.slice(0,5)));}); if(o) hit={o,d}; }
      if(hit){ const ev=hit.o.ev, when=`${relDay(hit.d)==='vandaag'||relDay(hit.d)==='morgen'?relDay(hit.d):'op '+dlong(hit.d)}${ev.start?' om '+ev.start:''}`;
        if(!ev.place) return R(`**${evTitle(ev,hit.d)}** is ${when}${ev.meet?`, verzamelen om ${ev.meet}`:''}, maar er staat geen adres bij. Vul de plaats in bij de afspraak, dan kan ik de route tonen.`,[link('agenda',hit.d)]);
        return withInsights(R(`**${evTitle(ev,hit.d)}** is ${when} in **${ev.place}**${ev.meet?`, verzamelen om ${ev.meet}`:''}. Hier is de route.`,[extLink.route(ev.place),extLink.verkeer()]),hit.d,1,ev.who); }
      if(typeW||rp.length) return R('Ik vind die afspraak niet in de agenda van de komende 3 maanden.',['agenda']);
    }
    if(dest) return R(`Hier is de route naar **${dest}**. Kijk ook even naar het verkeer als je op een spitsuur vertrekt.`,[extLink.route(dest),extLink.verkeer()]);
  }
  /* weer */
  if(has(q,'weer','weerbericht','weersvoorspelling','regen','regent','zon','zonnig','droog','koud','warm','wind','storm','graden','sneeuw','vriest','temperatuur','buien','paraplu','regenjas')){
    const dr=parseDates(q)||{from:t,days:2,label:'de komende dagen'}; const outs=[];
    for(let i=0;i<Math.min(dr.days,7);i++){const d=addDays(dr.from,i);eventsOn(d).filter(o=>OUTDOOR(o.ev)&&o.k===0).forEach(o=>outs.push(`${relDay(d)}: ${evTitle(o.ev,d)}${o.ev.start?' om '+o.ev.start:''}`));}
    if(WX.daily){ const lines=[]; for(let i=0;i<Math.min(dr.days,10);i++){ const d=addDays(dr.from,i), D=wxDay(d); if(!D) continue;
        lines.push(`- **${relDay(d)==='vandaag'||relDay(d)==='morgen'?relDay(d):DAYSL[parse(d).getDay()]+' '+parse(d).getDate()+' '+MON[parse(d).getMonth()]}**: ${WX_EMO(D.day.icon)} ${Math.round(D.day.temperature)}° / ${Math.round(D.night.temperature)}°, ${D.day.phrase.toLowerCase()}, ${D.day.rainProbabilityValue}% regen overdag${D.night.rainProbabilityValue>=40?` en ${D.night.rainProbabilityValue}% 's avonds/nacht`:''}`);
        eventsOn(d).filter(o=>OUTDOOR(o.ev)&&o.k===0).forEach(o=>{const w=wxForEv(o.ev,d);if(w)lines.push(`  ↳ ${evTitle(o.ev,d)}${o.ev.start?' om '+o.ev.start:''}: ${w.e} ${w.t}°, ${w.rain}% regen${w.rain>=50?' → regenjas mee':''}`)}); }
      if(lines.length){ const res=R(`Weer in ${wxLoc().name} (AccuWeather):\n${lines.join('\n')}`,[{url:'https://www.buienradar.be/',label:'Buienradar',icon:'🌧️'}]); res.links.unshift({k:'home',date:'',label:'Weerdetails'}); return res; } }
    return R(`Een weersvoorspelling kan ik zelf niet opvragen, maar hier kan je ze bekijken.${outs.length?`\n\nBuiten gepland ${dr.label}:\n${outs.map(x=>'- '+x).join('\n')}`:''}`,[extLink.weer(),extLink.buien(),extLink.kmi()]); }
  if(has(q,'verkeer','file','files','wegenwerken','ongeval')) return R('Actuele verkeersinfo en wegenwerken vind je bij het Vlaams Verkeerscentrum.',[extLink.verkeer(),extLink.zoek('wegenwerken '+homeTown())]);

  /* conflicten */
  if(hasPart(q,'conflict','probleem','problemen','botsen','botst','overlap','dubbel geboekt','lukt dat','haalbaar')){
    const dr=parseDates(q); const cs=dr?Array.from({length:Math.min(dr.days,31)},(_,i)=>conflictsOn(addDays(dr.from,i))).flat():upcomingConflicts(30);
    if(!cs.length) return R(`Ik zie geen conflicten${dr?' '+dr.label:' in de komende 30 dagen'}: niemand dubbel geboekt, geen krappe verplaatsingen en geen avonden waarop Charlotte en Ruben allebei weg zijn zonder oppas. 👍`,['agenda']);
    const res=R(`Dit zijn de mogelijke problemen${dr?' '+dr.label:' in de komende 30 dagen'}:\n${cs.slice(0,8).map(c=>'- ⚠️ '+c.text).join('\n')}${cs.length>8?`\n…en nog ${cs.length-8}.`:''}`,[link('agenda',cs[0].d)]);
    res.links.push(...cs.flatMap(c=>c.links||[]).slice(0,3)); return res; }
  /* afval */
  if(hasPart(q,'ophaling','afval','vuilniszak','vuilbak','container','pmd','gft','papier','karton','glas','restafval','huisvuil')){

  }

  }
  const bd=MEMBERS.filter(m=>m.born).map(m=>{const b=parse(m.born);let d=iso(new Date(parse(t).getFullYear(),b.getMonth(),b.getDate()));if(d<t)d=iso(new Date(parse(t).getFullYear()+1,b.getMonth(),b.getDate()));return {m,k:diffDays(d,t)}}).filter(x=>x.k>=0&&x.k<=7);
  bd.forEach(x=>L.push(`🎂 ${x.k===0?'Vandaag':x.k===1?'Morgen':'Over '+x.k+' dagen'} verjaart ${x.m.name}!`));
  P.sort((a,b)=>(b[0]==='!'?1:0)-(a[0]==='!'?1:0)); for(let i=0;i<P.length;i++) if(P[i][0]==='!') P[i]=P[i].slice(1);
  let out=`${greet()} ${nm(me)}!`;
  out+=P.length?`\n**Even regelen, dan zit alles goed:**\n${P.slice(0,6).map(x=>'- '+x).join('\n')}${P.length>6?`\n- …en nog ${P.length-6} kleinere dingetjes.`:''}`:`\nAlles ziet er de komende dagen goed uit. 👍`;
  if(L.length) out+=`\n**Goed om te weten:**\n${L.map(x=>'- '+x).join('\n')}`;
  return out+`\n${P.length?'Samen krijgen we dat vlot geregeld. Zal ik je ergens mee helpen?':'Geniet ervan! Vraag maar als je iets wil weten.'}`;
}

const KIDS=['nant','abel','max'];
const toMin=s=>{const [h,m]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const fromMin=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const DUR={Match:120,Training:90,Hobby:60,Afspraak:60,School:420,Uitstap:240,Feest:180,Werk:480};
function span(ev){ let s=toMin(ev.start); if(ev.type==='Match'&&ev.meet&&toMin(ev.meet)<s) s=toMin(ev.meet);
  const est=!ev.end; const e=ev.end?toMin(ev.end):toMin(ev.start)+(DUR[ev.type]||60); return {s,e:Math.max(e,s+15),est}; }
const samePlace=(a,b)=>{const x=norm(a),y=norm(b);return !x||!y||x===y||x.includes(y)||y.includes(x)};
const NEARBY=['tielt','pittem','meulebeke','ruiselede','wingene','aarsele','kanegem','schuiferskapelle','dentergem','ardooie','oostrozebeke','egem','zwevezele','koolskamp','wakken','roeselare','izegem','lichtervelde','zulte','deinze','beernem','oostkamp','ingelmunster','rumbeke','marialoop'];
function travelNeed(a,b){ if(samePlace(a,b)) return 10; const town=norm(homeTown()); const local=p=>norm(p).includes(town)||!/[a-z]{4,}/.test(norm(p)); const near=p=>local(p)||NEARBY.some(t=>norm(p).includes(t)); return local(a)&&local(b)?20:near(a)&&near(b)?30:50; }
const placeOf=ev=>ev.place||'';
function conflictsOn(d,extra,skipId){
  const out=[], dn=relDay(d)==='vandaag'||relDay(d)==='morgen'?relDay(d):DAYSL[parse(d).getDay()]+' '+parse(d).getDate()+' '+MON[parse(d).getMonth()];
  const dayEvs=eventsOn(d);
  let evs=dayEvs.filter(o=>!o.ev.allDay&&o.ev.start&&o.ev.virtual!=='waste'&&!o.ev.info&&o.ev.id!==skipId&&!isCand(o.ev)).map(o=>o.ev);
  if(extra&&extra.start&&!extra.allDay) evs=[...evs,Object.assign({id:'__new'},extra)];
  const T=ev=>evTitle(ev,d);
  /* a) per persoon: overlap of te krap */
  for(const p of ALL){
    const mine=evs.filter(ev=>(ev.who||[]).includes(p)).map(ev=>({ev,...span(ev)})).sort((a,b)=>a.s-b.s);
    for(let i=1;i<mine.length;i++){ const A=mine[i-1],B=mine[i];
      if(A.ev.virtual==='school'&&B.ev.virtual==='school') continue;
      if(A.ev.care||B.ev.care) continue;
      if(A.ev.virtual==='school'&&B.s>=A.e-5) continue;
      if(A.e>B.s+5&&!(A.est&&A.e-B.s<=30&&B.ev.virtual!=='school')){
        const sch=[A,B].find(x=>x.ev.virtual==='school'), oth=sch===A?B:A;
        if(sch){ out.push({lvl:'mid',key:`sc|${d}|${p}|${oth.ev.id}`,ids:[oth.ev.id],d,text:`${dn[0].toUpperCase()+dn.slice(1)} valt **${T(oth.ev)}** (${oth.ev.start}) tijdens de schooluren van ${nm(p)}. Afmelden op school en wie brengt/haalt?`}); continue; }
        out.push({lvl:'hi',key:`ov|${d}|${p}|${A.ev.id}|${B.ev.id}`,ids:[A.ev.id,B.ev.id],d,text:`${dn[0].toUpperCase()+dn.slice(1)} overlappen **${T(A.ev)}** (${A.ev.start}${A.ev.end?'–'+A.ev.end:''}) en **${T(B.ev)}** (${B.ev.start}) voor ${nm(p)}.`});
        continue; }
      const pa=placeOf(A.ev), pb=placeOf(B.ev); if(!pa||!pb||samePlace(pa,pb)) continue;
      const trav=travelNeed(pa,pb), need=trav+(['Match','Training'].includes(A.ev.type)?15:0), gap=B.s-A.e;
      if(gap<need+15){ out.push({lvl:gap<need?'hi':'mid',key:`tr|${d}|${p}|${A.ev.id}|${B.ev.id}`,ids:[A.ev.id,B.ev.id],d,
        text:`Krap voor ${nm(p)} ${dn}: **${T(A.ev)}** in ${pa} eindigt ${A.est?'rond ':'om '}${fromMin(A.e)}, en **${T(B.ev)}** in ${pb} ${B.ev.type==='Match'&&B.ev.meet?'verzamelt om '+B.ev.meet:'begint om '+B.ev.start}. ${gap<=0?'Dat lukt niet.':gap<need?`Maar ${gap} minuten om je om te kleden en ±${trav} min te rijden: dat lukt waarschijnlijk niet.`:`Maar ${gap} minuten voor ±${trav} min rijden${need>trav?' en omkleden':''}: krap.`}`,
        links:[{url:'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pa)+'&destination='+encodeURIComponent(pb)+'&travelmode=driving',label:'Reistijd checken',icon:'🧭'}]}); }
    }
  }
  /* b) beide ouders weg -> oppas */
  const parEv=p=>evs.filter(ev=>(ev.who||[]).includes(p)&&ev.virtual!=='school').map(ev=>({ev,...span(ev)}));
  const C=parEv('charlotte'), Rb=parEv('ruben'), seenB=new Set();
  for(const c of C) for(const r of Rb){
    const is=Math.max(c.s,r.s), ie=Math.min(c.e,r.e); if(ie-is<30) continue;
    const alone=KIDS.filter(k=>{ if((c.ev.who||[]).includes(k)||(r.ev.who||[]).includes(k)) return false;
      return !evs.some(ev=>(ev.who||[]).includes(k)&&(()=>{const x=span(ev);return x.s<=is+10&&x.e>=ie-10})()); });
    if(!alone.length) continue;
    const key=`bs|${d}|${c.ev.id}|${r.ev.id}`; if(seenB.has(key)) continue; seenB.add(key);
    const same=c.ev===r.ev||c.ev.id===r.ev.id;
    out.push({lvl:'mid',key,ids:[c.ev.id,r.ev.id],d,care:{start:fromMin(is),end:fromMin(ie),kids:alone},text:`${dn[0].toUpperCase()+dn.slice(1)} ${same?`gaan Charlotte en Ruben samen naar **${T(c.ev)}**`:`is Charlotte bij **${T(c.ev)}** en Ruben bij **${T(r.ev)}**`} (${fromMin(is)}–${fromMin(ie)}${c.est||r.est?', ongeveer':''}). ${names(alone)} ${alone.length>1?'zijn':'is'} dan thuis: **babysit of opvang nodig?**`});
  }
  /* c) kind moet ergens naartoe, ouders allebei bezet */
  for(const k of ['nant','abel']){
    for(const ev of evs.filter(ev=>(ev.who||[]).includes(k)&&ev.virtual!=='school'&&!(ev.who||[]).some(w=>PARENTS.includes(w)))){
      const x=span(ev), lo=x.s-30;
      const rd=rideOf(ev,d), busyP=(p,a,b)=>evs.find(e2=>e2!==ev&&(e2.who||[]).includes(p)&&e2.virtual!=='school'&&(()=>{const y=span(e2);return y.s<b&&y.e>a})());
      if(PARENTS.includes(rd.bring)){ const c=busyP(rd.bring,x.s-20,x.s); if(c) out.push({lvl:'hi',key:`rb|${d}|${ev.id}|${rd.bring}`,ids:[ev.id,c.id],d,text:`${nm(rd.bring)} brengt ${nm(k)} naar **${T(ev)}** (${ev.start}) ${dn}, maar heeft dan **${T(c)}** (${c.start}–${c.end||'?'}). Iemand anders laten brengen?`}); }
      if(PARENTS.includes(rd.fetch)){ const c=busyP(rd.fetch,x.e,x.e+20); if(c) out.push({lvl:'hi',key:`rf|${d}|${ev.id}|${rd.fetch}`,ids:[ev.id,c.id],d,text:`${nm(rd.fetch)} haalt ${nm(k)} op na **${T(ev)}** (${fromMin(x.e)}) ${dn}, maar heeft dan **${T(c)}** (${c.start}–${c.end||'?'}). Iemand anders laten halen?`}); }
      const busy=!rd.bring&&PARENTS.every(p=>evs.some(e2=>e2!==ev&&(e2.who||[]).includes(p)&&e2.virtual!=='school'&&(()=>{const y=span(e2);return y.s<x.s&&y.e>lo})()));
      if(busy) out.push({lvl:'mid',key:`br|${d}|${k}|${ev.id}`,ids:[ev.id],d,text:`Wie brengt ${nm(k)} naar **${T(ev)}** (${ev.type==='Match'&&ev.meet?'verzamelen '+ev.meet:ev.start}) ${dn}? Charlotte en Ruben zijn dan allebei bezet.`});
      const back=!rd.fetch&&PARENTS.every(p=>evs.some(e2=>e2!==ev&&(e2.who||[]).includes(p)&&e2.virtual!=='school'&&(()=>{const y=span(e2);return y.s<x.e+15&&y.e>x.e})()));
      if(back&&!busy) out.push({lvl:'mid',key:`hl|${d}|${k}|${ev.id}`,ids:[ev.id],d,text:`Wie haalt ${nm(k)} op na **${T(ev)}** (${x.est?'rond ':''}${fromMin(x.e)}) ${dn}? Charlotte en Ruben zijn dan allebei bezet.`});
    }
  }
  return out;
}

  if(!kid){
    S.admin.filter(x=>!x.done&&((x.due&&diffDays(x.due,t)<=3)||x.prio==='hoog')).forEach(x=>out.push({tx:`Te regelen: ${x.title} (${x.due<t?'te laat':relDay(x.due)})`,c:x.due<t?'var(--danger)':'var(--warn)'}));
    {const dc=dueChores();if(dc.length)out.push({tx:dc.length===1?`Ritme: ${dc[0].title} is klaar om te doen`:`Ritme: ${dc.length} klusjes klaar om te doen. Begin met "${dc[0].title}" (±${dc[0].minutes||5} min).`,c:col(me)});}
    S.tasks.filter(x=>!x.done&&x.prio==='hoog'&&x.who!==me).forEach(x=>out.push({tx:`Belangrijk klusje: ${x.title}`,c:'var(--danger)'}));
    S.tasks.filter(x=>!x.done&&x.who===me).sort((a,b)=>prioRank(a)-prioRank(b)).slice(0,3).forEach(x=>out.push({tx:`Klusje voor jou: ${x.title}`,c:col(me)}));
  }
  S.school.filter(x=>!x.done&&x.due&&diffDays(x.due,t)>=0&&diffDays(x.due,t)<=2&&(kid?x.kid===me:true)).forEach(x=>out.push({tx:`${kid?'':nm(x.kid)+': '}${x.type} "${x.title}" is ${relDay(x.due)}`,c:col(x.kid)}));
  eventsOn(addDays(t,1),kid?new Set([me]):null).filter(o=>!o.ev.virtual&&o.k===0).forEach(o=>out.push({tx:`Morgen: ${o.ev.title}${o.ev.start?' om '+o.ev.start:''} (${names(o.ev.who)})`,c:evColor(o.ev)}));
  {const tw=wasteOn(addDays(t,1));if(tw&&!kid&&wasteCfg().show)out.push({tx:`Morgen ophaling: ${tw.types.map(x=>WASTE[x]?.l||x).join(' + ')}. Vanavond buitenzetten!`,c:'var(--warn)'});}

  return out;
}

  sheetOpts=opts; const el=$('#sheet');

    <header><h2>${opts.lead||''}${esc(title)}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Sluiten">${icon('x')}</button></header>
    <div class="sheet-body">${body}</div>
    ${opts.onSave||opts.onDelete?`<footer>${opts.onDelete?`<button class="btn ghost danger" data-act="sheet-del">${icon('trash')} Verwijderen</button>`:''}<span class="sp"></span>${opts.onSave?`<button class="btn primary" data-act="sheet-save">${esc(opts.saveLabel||'Opslaan')}</button>`:''}</footer>`:''}</div>`;
  el.hidden=false; document.body.classList.add('noscroll');
  if(opts.mount) opts.mount(el.querySelector('.panel'));
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  if(window.__swiped&&Date.now()-window.__swiped<350&&t.closest('.mgrid,.day-panel')) return;
  const f=ACT[t.dataset.act]; if(!f) return;
  e.preventDefault(); unlockAudio(); f(t.dataset.v,t,e);
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.bt[role=button]')){e.preventDefault();e.target.click();return} if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); if(e.key==='Enter'&&e.target.id==='s-q'){e.preventDefault();ACT['shop-add-q']();} });
/* swipen over de maand: de kalender volgt je vinger, daarna vorige/volgende maand (of week als ingeklapt) */
{ let sx=0,sy=0,st=0,g=null,dx=0,lock=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('touchstart',e=>{ g=e.target.closest&&e.target.closest('.mgrid,.day-panel'); if(!g||e.touches.length!==1){g=null;return} sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); dx=0; lock=0; g.style.transition='none'; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!g) return; const x=e.touches[0].clientX-sx, y=e.touches[0].clientY-sy;
    if(!lock){ if(Math.abs(x)<8&&Math.abs(y)<8) return; lock=Math.abs(x)>Math.abs(y)?1:2; }
    if(lock!==1) return; dx=x; g.style.transform=`translate3d(${dx}px,0,0)`; },{passive:true});
  document.addEventListener('touchend',()=>{ if(!g) return; const el=g; g=null; if(lock!==1){el.style.transform='';return}
    const w=el.offsetWidth||320, fast=Math.abs(dx)>40&&Date.now()-st<300, go=Math.abs(dx)>w*0.22||fast;
    if(!go){ el.style.transition='transform .2s ease-out'; el.style.transform=''; return; }
    window.__swiped=Date.now(); const dir=dx<0?1:-1, coll=el.classList.contains('coll'), isDay=el.classList.contains('day-panel');
    const swap=()=>{ if(isDay) ACT['ag-day'](String(dir)); else if(coll) ACT['ag-wk'](String(dir)); else ACT['ag-month'](String(dir));
      const n=document.querySelector(isDay?'.day-panel':'.mgrid'); if(!n||reduce) return; n.style.transition='none'; n.style.transform=`translate3d(${dir*(w+16)+dx}px,0,0)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.style.transition='transform .2s cubic-bezier(.2,.8,.3,1)'; n.style.transform=''; })); };
    if(reduce){ swap(); return; }
    /* oude kaart (kopie) schuift weg terwijl de nieuwe tegelijk binnenschuift */
    const r=el.getBoundingClientRect(), ghost=el.cloneNode(true);
    Object.assign(ghost.style,{position:'fixed',left:r.left-dx+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'5',pointerEvents:'none',transition:'none',transform:`translate3d(${dx}px,0,0)`});
    ghost.removeAttribute('id'); document.body.appendChild(ghost);
    requestAnimationFrame(()=>{ ghost.style.transition='transform .2s cubic-bezier(.2,.8,.3,1)'; ghost.style.transform=`translate3d(${-dir*(w+16)}px,0,0)`; });
    setTimeout(()=>ghost.remove(),240);
    swap();
  },{passive:true});
}
document.addEventListener('input',e=>{ if(e.target.id==='rec-q'){ui.recQ=e.target.value;recFilter(e.target.value);return} if(ui.view==='settings'&&e.target.closest&&e.target.closest('#s-fam,#s-pets,#s-shop,#s-school')) ui.dirty=true; if(e.target.id==='s-q'){ui.shopQ=e.target.value;shopSearch(e.target.value);} });

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='ask'){ const q=$('#ask-q').value.trim(); $('#ask-q').value=''; chatSheet(q||undefined); return; }
  if(f.dataset.form==='shop'){
    const name=$('#s-name').value.trim(); if(!name) return;
    const qty=$('#s-qty').value.trim(), store=$('#s-store').value; ls.set('tb_store',store);
    $('#s-name').value=''; $('#s-qty').value='';
    await add('shopping',{name,qty,store,done:false});
    $('#s-name')?.focus();

    let title=$('#t-new').value.trim(); if(!title) return; $('#t-new').value='';
    const hi=title.startsWith('!'); if(hi) title=title.replace(/^!+\s*/,''); if(!title) return;
    await add('tasks',{title,who:'samen',done:false,due:'',prio:hi?'hoog':'normaal'}); log(`zette "${title}" op het klusjesbord`,PARENTS,'taak');
  }
});

/* ============ timers, herinneringen, feedback ============ */
const fired=new Set(ls.get('tb_fired',[]));
function markFired(k){fired.add(k);ls.set('tb_fired',[...fired].slice(-200))}
let lastDay=today();
function tick(){
  const now=Date.now(), C=2*Math.PI*24;
  document.querySelectorAll('[data-timer]').forEach(el=>{
    const t=S.timers.find(x=>x.id===el.dataset.timer); if(!t) return;
    const total=t.minutes*6e4, rem=t.startedAt+total-now, p=Math.min(1,Math.max(0,(now-t.startedAt)/total));
    el.querySelector('.t-rem').textContent=rem>0?fmtRem(rem):'Klaar!';
    el.querySelector('.fg').setAttribute('stroke-dashoffset',String(C*(1-p)));
    el.classList.toggle('done',rem<=0);
  });
  if(!me) return;
  S.timers.forEach(t=>{ const end=t.startedAt+t.minutes*6e4, k='t'+t.id;
    if(end<=now && !fired.has(k)){ markFired(k); if(now-end<15*6e4 && isParent(me) && kindOn('machine')){ toast(`${t.label} is klaar!`); sysNotify('Thuisbasis',`${t.label} is klaar. Tijd om uit te halen.`,'machine'); chime(880); setTimeout(()=>chime(660),180); scheduleRender(); } } });
  if(now%30000<1100){
    { const nd=new Date(); const tw=me&&isParent(me)&&typeof wasteOn==='function'?wasteOn(addDays(today(),1)):null; const k='w'+today(); if(tw&&wasteCfg().remind&&nd.getHours()>=19&&!fired.has(k)){ markFired(k); const txt=`Morgen ophaling: ${tw.types.map(x=>WASTE[x]?.l||x).join(' + ')}. Zet ze buiten!`; toast(`${wasteEmo(tw.types)} ${txt}`); sysNotify('Afval',txt,['gft','pmd','rest'].find(x=>(tw.types||[]).includes(x))||'rest'); chime(660); } }
    checkStock();
    for(const r of (S.reminders||[])){ if(!(r.who||[]).includes(me)||!remDue(r)) continue; const k='r'+r.id+r.date+(r.time||''); if(fired.has(k)) continue; markFired(k);
      toast(`🔔 ${r.title}`); sysNotify('Herinnering',r.title,'bell'); chime(740); setTimeout(()=>chime(988),160); vib(30); scheduleRender(); }
    const d=today();
    for(const o of eventsOn(d,isParent(me)?null:new Set([me]))){
      if(o.ev.allDay||!o.ev.start||o.k!==0) continue;
      const [hh,mm]=o.ev.start.split(':').map(Number); const st=parse(d); st.setHours(hh,mm,0,0);
      const diff=st-now, k='e'+o.ev.id+d;
      if(diff>0&&diff<=30*6e4&&!fired.has(k)){ markFired(k); if(prefs().reminders!==false) toast(`Om ${o.ev.start}: ${o.ev.title} (${names(o.ev.who)})`); sysNotify('Binnenkort',`${o.ev.start} ${o.ev.title} — ${names(o.ev.who)}`,o.ev.type==='Match'||o.ev.type==='Training'?'sport':'agenda'); }
    }
    if(d!==lastDay){lastDay=d;scheduleRender()}
  }
}
setInterval(tick,1000);

function toast(msg,by,undo){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=(by&&MID[by]?av(by,24):'')+`<span>${esc(msg)}</span>`+(undo?'<button class="undo">Ongedaan maken</button>':'');
  if(undo) el.querySelector('.undo').addEventListener('click',async ev=>{ev.stopPropagation();el.remove();vib(10);await undo();});
  const box=$('#toasts'); while(box.children.length>2) box.firstChild.remove();
  box.appendChild(el); setTimeout(()=>{el.style.transition='opacity .3s, transform .3s';el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),320)},undo?5500:3800);
}
function sysNotify(title,body,ico){ try{ if('Notification' in window && Notification.permission==='granted') new Notification(title,{body,icon:ico?`icons/n/${ico}.png`:'icons/v3/icon-192.png'}); }catch(e){} }
let AC=null;
function unlockAudio(){ try{ if(!AC){const A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A();} if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }
function chime(f){ try{ if(!AC||prefs().sound===false) return; const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.45); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+.5);}catch(e){} }
function floatStar(x,y){ const s=document.createElement('span'); s.className='floatstar'; s.innerHTML=STAR; s.style.left=x+'px'; s.style.top=y+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),950); }
function highFive(t){ const r=t.getBoundingClientRect(); const s=document.createElement('span'); s.className='floatstar'; s.style.color='var(--mecol)'; s.innerHTML=icon('hand'); s.style.left=(r.left+r.width/2)+'px'; s.style.top=r.top+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),950); chime(740); }
function confetti(main){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.hidden=false; c.width=innerWidth; c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement); const colors=['--c-charlotte','--c-ruben','--c-nant','--c-abel','--c-max'].map(v=>cs.getPropertyValue(v).trim()||'#f5b400');
  const ps=[...Array(140)].map(()=>({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,r:Math.random()*6+4,c:colors[Math.floor(Math.random()*colors.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<1900) requestAnimationFrame(f); else {x.clearRect(0,0,c.width,c.height);c.hidden=true} })(t0);
}
