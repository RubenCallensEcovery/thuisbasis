<style>
/* vlakke (flat) emoji op elk toestel: Twemoji, enkel voor emoji-tekens */
@font-face{font-family:"TBEmoji";src:url("fonts/twemoji.woff2") format("woff2");font-display:swap;
  unicode-range:U+203C,U+2049,U+2139,U+2194-2199,U+21A9-21AA,U+231A-231B,U+2328,U+23CF,U+23E9-23F3,U+23F8-23FA,U+24C2,U+25AA-25AB,U+25B6,U+25C0,U+25FB-25FE,U+2600-27BF,U+2934-2935,U+2B05-2B07,U+2B1B-2B1C,U+2B50,U+2B55,U+3030,U+303D,U+3297,U+3299,U+200D,U+20E3,U+FE0F,U+1F000-1FAFF,U+E0020-E007F}
[hidden]:not([hidden=until-found i]){display:none!important}body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}</style>

<title>Thuisbasis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@400;500;600&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header, content column, bottom tab bar on phone / left rail on tablet. Family colours carry identity; ink-navy carries actions. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface-2:#E8EDF5; --ink:#151B31; --muted:#5B6480; --line:#DCE2ED;
  --primary:#151B31; --on-primary:#FFFFFF; --danger:#CC3535; --ok:#178F52; --warn:#B86E00;
  --listed:#D9483B; --on-listed:#FFFFFF; --c-charlotte:#DB3F76; --c-ruben:#2C6FCB; --c-nant:#CF8600; --c-abel:#1F9858; --c-max:#8550D3; --c-all:#4A5370;
  --f-display:"TBEmoji","Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"TBEmoji","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --nav-h:68px;
  --shadow:0 1px 2px rgba(21,27,49,.06),0 6px 20px rgba(21,27,49,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131C; --surface:#191E2C; --surface-2:#232A3C; --ink:#EDF0F8; --muted:#A1A9C2; --line:#2C3449;
  --primary:#EDF0F8; --on-primary:#10131C; --danger:#F06A6A; --ok:#3DC985; --warn:#F0A63A;
  --listed:#C9443A; --on-listed:#FFFFFF; --c-charlotte:#F0679A; --c-ruben:#5C98EA; --c-nant:#F0A62A; --c-abel:#3FC07F; --c-max:#A57BEB; --c-all:#8C95B3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#191E2C; --surface-2:#232A3C; --ink:#EDF0F8; --muted:#A1A9C2; --line:#2C3449;
  --primary:#EDF0F8; --on-primary:#10131C; --danger:#F06A6A; --ok:#3DC985; --warn:#F0A63A;
  --listed:#C9443A; --on-listed:#FFFFFF; --c-charlotte:#F0679A; --c-ruben:#5C98EA; --c-nant:#F0A62A; --c-abel:#3FC07F; --c-max:#A57BEB; --c-all:#8C95B3;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c-ruben) 60%,transparent);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
/* routine: klein en grijs */
.ride{flex:none;align-self:center;display:inline-flex;align-items:center;gap:2px;margin-left:auto;padding:4px 6px;border-radius:999px;cursor:pointer;opacity:.85}
.ride:hover,.ride:focus-visible{opacity:1;background:color-mix(in srgb,var(--text) 7%,transparent)}
.ride .rd-car{font-size:13px;margin-right:2px;filter:grayscale(.3)}
.ride.empty{opacity:.3}.ride.empty .rd-car{filter:grayscale(1)}
.ride.empty:hover{opacity:.7}
.rd{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:800;color:#fff;line-height:1}
.rd.zelf{background:transparent;font-size:12px}.rd.none{background:transparent;color:var(--muted)}
.rd-a{font-size:11px;color:var(--muted);font-weight:700;margin:0 1px}
.rt-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:2px 0 6px}
@media (min-width:700px){.rt-row{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.rt-row+.rt-row{margin-top:0}
.rt-row:last-of-type{margin-bottom:8px}
.rt{border:0;background:var(--surface-2);color:var(--muted);font-size:12.5px;letter-spacing:-.005em;font-weight:600;line-height:1.25;padding:6px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;cursor:pointer;opacity:.9;min-width:0}
.rt .rt-l{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.rt .rt-t{font-variant-numeric:tabular-nums;opacity:.8;font-size:11.5px;padding-left:1px}
.rt-d{display:inline-flex}.rt-d em{width:7px;height:7px;border-radius:50%;margin-right:-2px;box-shadow:0 0 0 1.5px var(--surface-2);filter:saturate(.5)}
.rt:hover,.rt:focus-visible{opacity:1;background:color-mix(in srgb,var(--text) 10%,var(--surface-2))}
.tt-rt{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}.tt-rt span{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px;font-weight:600}
.wd2-rt{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px;opacity:.6;font-size:11px}.wd2-rt span{display:inline-flex;align-items:center;gap:1px;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:999px;padding:1px 6px 1px 4px}.wd2-rt em{width:5px;height:5px;border-radius:50%;margin-left:1px}
svg.wico{width:1.15em;height:1.15em;vertical-align:-.18em;display:inline-block}
svg.wolf{width:1.35em;height:1.35em;vertical-align:-.3em;flex:none;color:var(--text)}
.cb-tag svg.wolf{width:1.2em;height:1.2em}
.spark-btn svg.wolf{width:28px;height:28px}
.top .spark-btn{width:44px;height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.top .spark-btn:active{transform:scale(.94)}
html[data-style="bauhaus"] .top .spark-btn{border-radius:0;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--bh-yellow)}
html[data-style="bauhaus"] .top .spark-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bh-yellow)}
h2 svg.wolf{margin-right:10px;width:1.7em;height:1.7em;vertical-align:-.45em}
.cb-spark svg.wolf{width:48px;height:48px;transform-origin:50% 85%;animation:wolfTilt 2.6s ease-in-out infinite}
.spark-btn:hover svg.wolf,.spark-btn:focus-visible svg.wolf{animation:wolfTilt .9s ease-in-out}
/* Jonah bijt af en toe: de onderkaak klapt dicht en weer open */
svg.wolf .jaw{transform-box:view-box;transform-origin:600px 540px}
.top .spark-btn svg.wolf .jaw{animation:jonahBite 7s ease-in-out infinite;animation-delay:var(--ph-bite,0ms)}
svg.wolf.chomp-once .jaw{animation:jonahChomp 1.1s ease-in-out .25s 1}
@keyframes jonahBite{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(7deg)}88%{transform:rotate(0)}92%{transform:rotate(7deg)}96%{transform:rotate(0)}}
@keyframes jonahChomp{0%,100%{transform:rotate(0)}20%{transform:rotate(7deg)}40%{transform:rotate(0)}60%{transform:rotate(7deg)}80%{transform:rotate(0)}}
/* de vijf gezinsvormen rollen af en toe uit en terug in */
.brand .dots i{position:relative;z-index:calc(10 - var(--n,0));transform-origin:50% 50%;animation:shapeRoll 12s cubic-bezier(.45,.05,.35,1) infinite;animation-delay:var(--ph-roll,0ms)}
/* alle vormen rollen zijwaarts achter de eerste (op één hoopje) en rollen dan weer uit */
@keyframes shapeRoll{0%,76%,100%{transform:translateX(0) rotate(0)}84%,88%{transform:translateX(calc(var(--n,0) * -15px)) rotate(-360deg)}96%{transform:translateX(0) rotate(0)}}
@media (prefers-reduced-motion:reduce){svg.wolf .jaw,.brand .dots i{animation:none!important}}
@keyframes wolfTilt{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-10deg)}82%{transform:rotate(7deg)}92%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){svg.wolf{animation:none!important}}
svg.ni{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dots{display:flex;gap:3px}
.brand .dots i{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.local i{background:var(--warn)}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg.i{width:18px;height:18px}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:620px;margin:0 auto;height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.nav button .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .pill{background:color-mix(in srgb,var(--mecol) 18%,transparent);color:var(--mecol)}
@media (min-width:900px){
  .nav{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
  .nav-in{grid-auto-flow:row;grid-auto-rows:78px;height:auto}
  .app{padding-left:96px}
  main{padding-bottom:40px}
  .top-in{padding-left:24px}
}

/* type & sections */
.hello{padding-block:10px 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(28px,6vw,40px);line-height:1.05}
.hello h1 em{font-style:normal;color:var(--mecol)}
.hello .date{color:var(--muted);font-weight:500;margin-top:4px;text-transform:capitalize}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:20px}
.sec-h .sp{flex:1}
.lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.g-home{grid-template-columns:1.25fr 1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{flex:1}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}
.empty b{color:var(--ink)}

/* buttons, inputs */
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);min-height:42px;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn svg.i{width:18px;height:18px}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;min-width:0}
.in:focus{border-color:var(--mecol);outline:none}
textarea.in{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--primary)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;min-height:38px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--primary));background:color-mix(in srgb,var(--cc,var(--primary)) 14%,var(--surface))}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* avatars */
.av{--s:28px;width:var(--s);height:var(--s);border-radius:50%;background:var(--mc);color:#fff;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:calc(var(--s)*.46);flex:none;box-shadow:0 0 0 2px var(--surface)}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-8px}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li.tap{cursor:pointer;border-radius:10px}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.tick svg.i{width:16px;height:16px;stroke-width:3}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.tag.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* events */
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--evc) 11%,var(--surface));cursor:pointer;min-width:0;border:0;text-align:left;width:100%}
.ev .when{font-size:13px;font-weight:700;min-width:48px;color:var(--evc);font-variant-numeric:tabular-nums;padding-top:2px}
.ev .body{flex:1;min-width:0}
.ev .title{font-weight:600;overflow-wrap:anywhere}
.ev .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev.cand{background:color-mix(in srgb,var(--evc) 5%,var(--surface));outline:1.5px dashed color-mix(in srgb,var(--evc) 55%,transparent);outline-offset:-1.5px}
.sq-pick{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;color:#fff;background:var(--evc);border-radius:999px;padding:3px 9px;cursor:pointer}
.sq-pick:hover,.sq-pick:focus-visible{filter:brightness(1.08)}
.meal-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:2px 2px 6px}
.meal-line b{color:var(--ink);font-weight:600}

/* agenda */
.ag-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px}
.ag-title{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:capitalize;margin-right:auto}
.ag-mnav{display:flex;align-items:center;gap:2px;flex:1 1 100%;min-width:0}
.ag-mnav .ag-title{margin-right:0;text-align:left}
.ag-mnav .sp{flex:1}
.ag-mnav .icon-btn{background:transparent;flex:none;color:var(--muted)}
.ag-mnav .icon-btn:hover{background:var(--surface-2);color:var(--text)}
.ag-wk{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters .chip{flex:none}
.day{padding:12px 0;border-bottom:1px solid var(--line)}
.wk-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(84%,380px);gap:12px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 16px 14px;margin:0 -16px;scroll-padding-inline:16px;align-items:start}
.wk-scroll::-webkit-scrollbar{display:none}
@media (min-width:700px){.wk-scroll{grid-auto-columns:calc((100% - 56px)/3)}}
@media (min-width:1200px){.wk-scroll{grid-auto-columns:calc((100% - 68px)/4)}}
.wkc.day{scroll-snap-align:start;scroll-snap-stop:normal;border:0;padding:14px 14px 12px;min-height:180px}
.wkc.is-today{box-shadow:inset 0 0 0 2px var(--primary),var(--shadow)}
.wkc.we{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.wk-more{scroll-snap-align:start;align-self:center;display:grid;place-items:center;min-width:140px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h .dn{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:capitalize}
.day-h .today-tag{font-size:11px;font-weight:700;background:var(--primary);color:var(--on-primary);padding:2px 8px;border-radius:999px}
.mgrid-wrap{overflow:hidden;padding:4px 4px 8px;margin:-4px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:6px;min-width:300px;will-change:transform}
.mgrid .wd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.mcell{border:0;background:var(--surface);box-shadow:0 1px 2px rgba(21,27,49,.07),0 2px 8px rgba(21,27,49,.04);border-radius:12px;min-height:64px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.mcell.out{opacity:.45}
.mcell .n{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mcell.today .n{background:var(--primary);color:var(--on-primary)}
.mcell[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--mecol)}
.mdots{display:flex;flex-wrap:wrap;gap:3px}
.mgrid,.day-panel{touch-action:pan-y}
.day-panel{will-change:transform}
.mdots i{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.mdots i.multi{width:10px;height:10px;margin:-1px 0}
.mcell.vacd::before{content:"";position:absolute;top:var(--vt);bottom:var(--vb);left:var(--vl);right:var(--vr);background:color-mix(in srgb,var(--vc) 13%,var(--surface));border:solid color-mix(in srgb,var(--vc) 55%,transparent);border-width:var(--bt) var(--br) var(--bb) var(--bl);border-radius:var(--rtl) var(--rtr) var(--rbr) var(--rbl);z-index:0;pointer-events:none}
.mcell.vacd{background:transparent;box-shadow:none}
.mcell.vacd::after{content:"";position:absolute;inset:0;background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(21,27,49,.07),0 2px 8px rgba(21,27,49,.04);z-index:0;pointer-events:none}
.mcell.out.vacd::after{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.mcell.out.vacd{opacity:1}.mcell.out.vacd>*{opacity:.45}
.mcell.vacd>*{position:relative;z-index:1}
.mcell.vacd>.m-add{position:absolute}
.mcell[aria-pressed="true"]{outline:2px solid var(--mecol);outline-offset:-2px}
@media (min-width:900px){.mcell{min-height:92px}.ag-split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:112px}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.tile .big{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.tile .cap{font-size:13px;color:var(--muted);font-weight:600}

/* machines */
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mach{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.mach .ring{position:relative;width:56px;height:56px;flex:none}
.mach .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.mach .ring circle{fill:none;stroke-width:6}
.mach .ring .bg{stroke:var(--surface-2)}
.mach .ring .fg{stroke:var(--c-ruben);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.mach .ring .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.mach .t-rem{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.mach.done{background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.mach.done .ring .fg{stroke:var(--ok)}
.mach.done .t-rem{color:var(--ok)}
.mach.done .ring .ico{color:var(--ok);animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.presets{display:flex;gap:8px;flex-wrap:wrap}

/* score */
.score{display:flex;gap:10px;flex-wrap:wrap}
.score .p{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px}

/* shopping */
.addbar{display:grid;grid-template-columns:1fr 92px;gap:8px}
.addbar .full{grid-column:1/-1}
@media (min-width:600px){.addbar{grid-template-columns:1fr 110px 170px auto}.addbar .full{grid-column:auto}}
.store-h{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-weight:700}
.store-h .n{font-size:12px;color:var(--muted);font-weight:600}

/* boodschappen-tegels */
.shop-search{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;padding:12px}
.sm-sel{width:auto;min-height:36px;padding:6px 10px;border-radius:999px}
.tiles-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
@media (min-width:700px){.tiles-s{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}
.stile{position:relative;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;text-align:center;min-width:0;transition:transform .12s,background .15s}
.stile:active{transform:scale(.94)}
.stile .em{font-size:30px;line-height:1}
.stile .nm{font-size:12.5px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stile .qt{font-size:11px;font-weight:600;color:var(--muted);line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.stile.on{background:var(--listed);color:var(--on-listed)}
.stile.on .qt{color:var(--on-listed);opacity:.85}
.stile.new{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.stile .ed{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.stile .ed svg.i{width:15px;height:15px}
.stile.pop{animation:popout .3s ease-in forwards}
@keyframes popout{to{transform:scale(.6);opacity:0}}
.cat-nav{position:relative}
.cat-nav .chip span{font-size:16px}
.cat-sec{scroll-margin-top:140px}
/* voorraad */
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none}
.stock{display:flex;flex-direction:column;gap:10px}
.sem{font-size:30px;line-height:1;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--surface-2);flex:none}
.sem.sm{font-size:20px;width:34px;height:34px;border-radius:10px}
.gauge{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:5px;background:var(--sc);transition:width .5s}
.lowstrip{margin-top:14px;background:color-mix(in srgb,var(--listed) 9%,var(--surface))}
/* ritme */
.onething{display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--mecol) 8%,var(--surface))}
.ot-main{border:0;background:var(--surface);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow);width:100%}
.ot-e{font-size:34px;line-height:1;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--mecol) 14%,transparent);flex:none}
.ot-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ot-t b{font-size:17px;font-family:var(--f-display);font-weight:600;overflow-wrap:anywhere}
.ot-t span{font-size:13px;color:var(--muted)}
.dt-row{display:inline-flex;gap:2px;font-size:16px}
.energy{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.en-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.en{border:0;border-radius:14px;background:var(--surface-2);padding:10px 4px;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;transition:background .15s,transform .1s}
.en .en-e{font-size:14px;letter-spacing:-2px}
.en.on{background:var(--mecol);color:#fff}
.en:active{transform:scale(.96)}
.lane-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.lane-h h3{font-size:19px}
.lane-dot{width:12px;height:12px;border-radius:50%}
.now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.now{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .15s}
.now.first{grid-column:1/-1;flex-direction:row;text-align:left;gap:16px;padding:18px;background:color-mix(in srgb,var(--wc) 10%,var(--surface))}
.now.first .now-t{font-size:20px;font-family:var(--f-display);font-weight:600}
.now-txt{display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.now.first .now-txt{flex:1;align-items:flex-start}
@media (min-width:700px){.now.first{grid-column:span 2}}
.now-ring{position:relative;flex:none;display:grid;place-items:center}
.now-e{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;transition:transform .2s}
.now.first .now-e{font-size:46px}
.now-check{position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);opacity:0;transform:scale(.4);transition:all .25s}
.now-check svg.i{width:44px;height:44px;stroke-width:3}
.now-t{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.now-s{font-size:12.5px;color:var(--muted)}
.ring2 .hold{transition:stroke-dashoffset .1s}
.now.holding{transform:scale(.97)}
.now.holding .ring2 .hold{stroke-dashoffset:0;transition:stroke-dashoffset .75s linear}
.now.popdone .now-e{transform:scale(0)}
.now.popdone .now-check{opacity:1;transform:scale(1)}
.now.popdone .ring2 .hold{stroke-dashoffset:0}
.now.popdone{animation:nowout .45s .25s ease-in forwards}
@keyframes nowout{to{transform:scale(.85);opacity:0}}
.now:focus-visible{outline:3px solid var(--mecol);outline-offset:3px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0}
.calm{display:flex;gap:14px;align-items:center;font-size:15px}
.calm>span{font-size:38px}
.done-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.ds{position:relative;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,var(--surface));display:grid;place-items:center;font-size:20px}
.ds svg.i{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;background:var(--ok);color:#fff;border-radius:50%;padding:2px;stroke-width:3}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px 8px}
.wk-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:4px 0;border-radius:12px}
.wk-col.we{background:var(--surface-2)}
.wk-d{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wk-d b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk-d span{font-weight:700;font-variant-numeric:tabular-nums}
.wk-items{display:flex;flex-direction:column;gap:4px;align-items:center;min-height:36px}
.wk-i{border:0;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--wc) 16%,var(--surface));font-size:18px;display:grid;place-items:center;padding:0}
.later{display:flex;flex-direction:column;gap:6px}
.lt{border:0;background:var(--surface);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow);opacity:.85}
.lt-e{font-size:20px}
.lt-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lt-t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lt-d{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.fresh{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:180px}
.fresh i{display:block;height:100%;background:var(--ok);border-radius:3px}
.ideas{margin-top:16px}
.ideas summary{cursor:pointer;font-weight:600;color:var(--muted)}
.focus{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.fx-e{font-size:56px;text-align:center;line-height:1}
.fx-ring{position:relative;width:170px;height:170px;margin:0 auto}
.fx-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fx-ring circle{fill:none;stroke-width:9}
.fx-ring .bg{stroke:var(--surface-2)}
.fx-ring .fg{stroke:var(--mecol);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.fx-time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;font-weight:600}
/* prioriteit */
.prio{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:2px}
.prio.hi{background:var(--danger);color:#fff}
.prio.lo{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.li.hi-row{box-shadow:inset 3px 0 0 var(--danger);padding-left:10px;border-radius:4px}
.li.lo-row .t{color:var(--muted);font-weight:500}
.now-t .prio{display:table;margin:0 auto 4px}
.now.first .now-t .prio{margin:0 0 4px}
/* levendig */
main.enter{animation:viewin .32s cubic-bezier(.2,.9,.3,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}
.nav button .pill{transition:background .25s,transform .25s}
.nav button[aria-current="page"] .pill{transform:scale(1.06)}
.nav button:active .pill{transform:scale(.9)}
.btn,.chip,.tile,.rcard,.icon-btn,.tick{transition:transform .12s,background .15s}
.btn:active,.chip:active,.tile:active,.rcard:active,.tick:active{transform:scale(.95)}
.tile:hover,.rcard:hover{transform:translateY(-2px)}
.home-top{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
@media (min-width:900px){.home-top{display:grid;grid-template-columns:1.4fr 1fr;align-items:stretch}}
.fam{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.fam-p{flex:1 0 64px;border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.fam-p.me{box-shadow:inset 0 0 0 2px var(--mc),var(--shadow)}
.fam-av{position:relative;display:inline-flex}
.fam-av .av{box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 25%,transparent)}
.live{position:absolute;right:-1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--surface);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.fam-n{font-weight:700;font-size:13px}
.fam-s{font-size:11px;color:var(--muted);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:0 2px}
.fam-s.free{color:var(--ok);font-weight:600}
.cd{border:0;text-align:left;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--evc) 22%,var(--surface)),color-mix(in srgb,var(--evc) 6%,var(--surface)));width:100%}
.cd-e{font-size:46px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.cd-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.cd-n{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1;color:var(--evc)}
.cd-t{font-weight:700;overflow-wrap:anywhere}
.moons{font-size:13px;letter-spacing:1px;margin-top:2px;overflow-wrap:anywhere}
.ad-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ad{border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;background:color-mix(in srgb,var(--evc) 15%,var(--surface));color:var(--ink)}
.tl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.tl{min-width:560px;position:relative;padding-top:22px}
.tl-hours{position:absolute;inset:0 0 auto 0;height:18px}
.tl-hours span{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-track{position:relative;height:calc(var(--rows) * 46px);background:repeating-linear-gradient(90deg,var(--surface-2) 0 1px,transparent 1px calc(100%/7.5));border-radius:12px}
.tl-ev{position:absolute;height:40px;border:0;border-radius:12px;background:color-mix(in srgb,var(--evc) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--evc);padding:4px 8px;text-align:left;font-size:12.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:transform .15s}
.tl-ev b{color:var(--evc);font-variant-numeric:tabular-nums}
.tl-ev.past{opacity:.5}
.tl-ev:hover{transform:translateY(-2px)}
.tl-now{position:absolute;top:-6px;bottom:-4px;width:2px;background:var(--danger);border-radius:1px}
.tl-now i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--danger);padding:1px 5px;border-radius:999px}
.li[data-swipe]{position:relative;overflow:hidden;padding:0;touch-action:pan-y}
.sw-fg{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:11px 2px;background:var(--surface);transform:translateX(var(--dx,0px));transition:transform .25s cubic-bezier(.2,.9,.3,1);position:relative;z-index:1}
.li.hi-row .sw-fg{padding-left:10px}
.li.swiping .sw-fg{transition:none}
.sw-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(90deg,var(--ok) 50%,var(--danger) 50%)}
.sw-bg span{display:flex;align-items:center;gap:6px;opacity:.6;transition:opacity .15s,transform .15s}
.sw-bg svg.i{width:18px;height:18px}
.li.sw-r .sw-ok,.li.sw-l .sw-del{opacity:1;transform:scale(1.12)}
.toast .undo{border:0;background:color-mix(in srgb,var(--on-primary) 18%,transparent);color:var(--on-primary);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;margin-left:4px;white-space:nowrap}
.toast{animation:toastin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes toastin{from{transform:translateY(16px) scale(.96);opacity:0}}
/* huishouden-tabs */
.htabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:18px;padding:4px;margin-bottom:10px;box-shadow:0 6px 14px -10px rgba(21,27,49,.3)}
.htab{border:0;background:transparent;border-radius:14px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12.5px;color:var(--muted);position:relative;transition:background .2s,color .2s,transform .12s;min-width:0}
.htab:active{transform:scale(.95)}
.htab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ht-e{font-size:20px;line-height:1;transition:transform .25s}
.htab[aria-selected="true"] .ht-e{transform:scale(1.15) rotate(-6deg)}
.ht-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ht-n{position:absolute;top:3px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mecol);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ht-n.hot{background:var(--danger)}
.ht-n.ok{background:var(--ok);animation:pulse 1.6s infinite}
.htab-body{animation:viewin .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.htab{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:10px 6px}.ht-n{position:static}}
/* instellingen */
.set-jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.set-jump .chip{flex:none}
.set-grid{display:grid;gap:14px}
@media (min-width:900px){.set-grid{grid-template-columns:1fr 1fr;align-items:start}}
.set{display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.set h2{font-size:19px;display:flex;align-items:center;gap:10px}
.set-note{font-size:13px;color:var(--muted);margin:2px 0 0}
.set-actions{display:flex;justify-content:flex-end}
.fam-edit{display:grid;gap:10px}
.fe{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surface-2)}
.sw-row{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:30px;height:30px;border-radius:50%;border:0;background:var(--s);padding:0;transition:transform .12s;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);transform:scale(1.08)}
.swatch.reset{background:var(--surface);color:var(--muted);font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.swatch.reset.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pet,.mach-r{gap:8px;padding:6px 0}
.tgl-list{display:flex;flex-direction:column}
.tgl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tgl:last-child{border-bottom:0}
.tgl-l{flex:1;display:flex;flex-direction:column;min-width:0}
.tgl-l b{font-weight:600}
.tgl-l span{font-size:12.5px;color:var(--muted)}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl-s{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl-s::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tgl input:checked+.tgl-s{background:var(--ok)}
.tgl input:checked+.tgl-s::after{transform:translateX(20px)}
.tgl input:focus-visible+.tgl-s{outline:3px solid color-mix(in srgb,var(--c-ruben) 60%,transparent);outline-offset:2px}
.data-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.data-row:last-child{border-bottom:0}
.data-row>div{flex:1;min-width:0;display:flex;flex-direction:column}
.data-row span{font-size:12.5px;color:var(--muted)}
.icon-btn[aria-current="page"]{background:var(--surface-2)}
/* weekoverzicht home */
.wk2{margin:2px 0 14px}
.wk2-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wk2-h h2{font-size:20px}
.wk2-h .btn svg.i{width:16px;height:16px}
.wk2-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,42%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
@media (min-width:700px){.wk2-row{grid-auto-columns:minmax(150px,1fr)}}
@media (min-width:1100px){.wk2-row{grid-auto-flow:row;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible}}
.wd2{scroll-snap-align:start;border:0;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:168px;transition:transform .15s}
.wd2:active{transform:scale(.97)}
.wd2.today{background:var(--primary);color:var(--on-primary)}
.wd2.today .wd2-n,.wd2.today .wd2-free,.wd2.today .wd2-more,.wd2.today .wd2-meal{color:color-mix(in srgb,var(--on-primary) 72%,transparent)}
.wd2.we:not(.today){background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.wd2-top{display:flex;flex-direction:column;line-height:1.15}
.wd2-top b{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:capitalize}
.wd2-n{font-size:12px;color:var(--muted);font-weight:600}
.wd2-band{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--evc) 22%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd2.today .wd2-band{background:color-mix(in srgb,var(--evc) 45%,transparent);color:var(--on-primary)}
.wd2-list{display:flex;flex-direction:column;gap:5px;flex:1}
.wd2-ev{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0;line-height:1.2}
.wd2-dots{display:flex;flex:none;font-style:normal}
.wd2-dots em{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface)}
.wd2.today .wd2-dots em{box-shadow:0 0 0 1.5px var(--primary)}
.wd2-dots em+em{margin-left:-3px}
.wd2-tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wd2-tt b{font-variant-numeric:tabular-nums;font-weight:700}
.wd2-more,.wd2-free{font-size:12px;color:var(--muted);font-weight:600}
.wd2-meal{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd2.today .wd2-meal{border-color:color-mix(in srgb,var(--on-primary) 25%,transparent)}
/* school */
.sk{gap:10px}
.sk-times{display:grid;gap:6px}
.sk-row{display:grid;grid-template-columns:34px 1fr 12px 1fr;gap:6px;align-items:center}
.sk-row>span:first-child{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase}
.sk-row .in{min-height:40px;padding:6px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.match-box{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--c-abel) 9%,var(--surface-2))}
/* afval */
.waste-card{border:0;text-align:left;display:flex;align-items:center;gap:14px;width:100%}
.wc-e{font-size:30px;letter-spacing:2px;line-height:1;flex:none}
.wc-e.sm{font-size:20px;letter-spacing:0}
.wc-b{flex:1;min-width:0;display:flex;flex-direction:column}
.wc-b b{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:capitalize}
.wc-b span:last-child{font-size:13px;color:var(--muted)}
.wd2{position:relative}
.wd2-waste{position:absolute;top:8px;right:8px;font-size:15px;letter-spacing:-2px}
/* dag tikken */
.day-h{align-items:center}
.day-add{margin-left:auto;border:0;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;transition:transform .12s,background .15s}
.day-add svg.i{width:18px;height:18px}
.day-add:hover{background:color-mix(in srgb,var(--mecol) 18%,var(--surface))}
.day-add:active{transform:scale(.9)}
.day-empty{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.day-empty svg.i{width:16px;height:16px}
.day-empty:hover{border-color:var(--mecol);color:var(--ink)}
.mcell{position:relative}
.m-add{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--mecol);color:#fff;display:grid;place-items:center}
.m-add svg.i{width:13px;height:13px;stroke-width:3}
/* assistent */
@media (max-width:440px){.sync{font-size:0;gap:0}.sync i{width:9px;height:9px}}
.spark-btn{font-size:20px}
.askbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 14px;margin:-4px 0 16px;border:1.5px solid transparent;transition:border-color .2s}
.askbar:focus-within{border-color:var(--mecol)}
.askbar .in{border:0;min-height:40px;padding:6px 4px;background:transparent}
.askbar .in:focus{outline:none}
.ask-spark{font-size:18px}
.askbar .btn{border-radius:50%;width:40px;height:40px;padding:0;justify-content:center}
.chat-panel{height:min(86%,720px)}
@media (max-width:699px){.chat-panel{height:92%}}
.chat-panel .sheet-body{display:flex;flex-direction:column;flex:1;min-height:0;padding-bottom:12px}
.chat{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
.cb{max-width:86%;padding:10px 14px;border-radius:18px;line-height:1.45;overflow-wrap:anywhere;animation:toastin .25s cubic-bezier(.2,1.2,.4,1)}
.cb.me{align-self:flex-end;background:var(--mecol);color:#fff;border-bottom-right-radius:6px}
.cb.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.cb.err{background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.cb-li{display:block;padding-left:14px;position:relative}
.cb-li::before{content:"•";position:absolute;left:2px}
.cb-links{display:flex;flex-wrap:wrap;gap:6px}
.cb-links .btn svg.i{width:15px;height:15px}
.cb-hi{display:flex;flex-direction:column;gap:4px;padding:8px 4px}
.cb-hi b{font-family:var(--f-display);font-weight:600;font-size:19px}
.cb-spark{font-size:30px}
.chat-in{display:flex;gap:8px;align-items:center}
.chat-in .btn{flex:none}
#chat-send{width:48px;height:48px;min-width:48px;min-height:48px;padding:0;border-radius:50%;justify-content:center;aspect-ratio:1}
.askbar .btn{min-width:40px;min-height:40px;flex:none;aspect-ratio:1}
.dots3{display:inline-flex;gap:4px;padding:4px 0}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.cb-tag{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cb.cl{background:color-mix(in srgb,var(--mecol) 9%,var(--surface-2))}
.ask-claude{color:var(--muted)}
/* acties */
.acts{display:flex;flex-direction:column;gap:8px}
.act{border-radius:16px;padding:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--mecol);display:flex;flex-direction:column;gap:10px;animation:toastin .25s}
.act-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.act-b b{overflow-wrap:anywhere}
.act-btns{display:flex;gap:6px;flex-wrap:wrap}
.act.done{box-shadow:inset 0 0 0 1.5px var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.act.cancel{opacity:.6;box-shadow:inset 0 0 0 1.5px var(--line)}
.act.busy{opacity:.7}
.act-r{font-size:13px;font-weight:700;color:var(--ok)}
.act.cancel .act-r{color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.btn.ext{background:color-mix(in srgb,var(--c-ruben) 12%,var(--surface))}
/* waarschuwingen */
.warn-card{margin-bottom:14px;background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.li.warn .t{line-height:1.4}
.li.warn{background:transparent;padding-left:0;padding-right:0}
.fwarn{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));font-size:14px;line-height:1.4}
/* bento home */
@media (max-width:440px){.top-in{gap:2px}.top .icon-btn{width:38px;height:38px}.brand{font-size:17px;gap:6px}.brand .dots i{width:7px;height:7px}}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;grid-auto-flow:row dense;margin-top:4px}
@media (min-width:700px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1150px){.bento{grid-template-columns:repeat(6,minmax(0,1fr))}}
.bt{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;animation:btin .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * 40ms);transition:transform .18s cubic-bezier(.2,.9,.3,1),box-shadow .18s}
@keyframes btin{from{opacity:0;transform:translateY(12px) scale(.98)}}
.bt[role=button]{cursor:pointer}
.bt[role=button]:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(21,27,49,.06),0 14px 30px rgba(21,27,49,.1)}
.bt[role=button]:active{transform:scale(.97)}
.bt.full{grid-column:1/-1}
.bt.w2{grid-column:span 2}
@media (min-width:700px){.bt.h2{grid-row:span 2}}
.bt-h{display:flex;align-items:center;gap:8px;min-width:0}
.bt-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--tc) 16%,transparent);flex:none}
.bt-l{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-go{color:var(--muted);opacity:.5;transition:transform .2s,opacity .2s}
.bt-go svg.i{width:16px;height:16px}
.bt[role=button]:hover .bt-go{opacity:1;transform:translateX(3px)}
.big-n{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1;margin-top:auto}
.big-n small{font-size:14px;font-family:var(--f-body);font-weight:600;color:var(--muted)}
.big-e{font-size:32px;letter-spacing:2px;margin-top:auto;line-height:1}
.bt-sub{font-size:12.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt.s{min-height:150px}
.bt.alert{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--danger) 50%,transparent),var(--shadow)}
.bt.soon-t{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.mini-chips{display:flex;flex-wrap:wrap;gap:4px}
.mini-chips span{font-size:11.5px;font-weight:600;background:var(--surface-2);padding:3px 7px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .wk2{margin:0}
.bt .wk2-h h2{font-size:17px}
.wk-t{padding:12px 12px 8px}
.wk-t .wd2{box-shadow:none;background:var(--surface-2)}
.wk-t .wd2.today{background:var(--primary)}
.warn-t{background:color-mix(in srgb,var(--danger) 6%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 40%,transparent),var(--shadow)}
.warn-scroll{display:flex;flex-direction:column;gap:8px}
.warn-t .bt-h{cursor:pointer;user-select:none}
.warn-t.fold .bt-h{margin-bottom:0}
.wfold{margin-left:6px;display:inline-flex;transition:transform .2s;color:var(--muted);transform:rotate(90deg)}
.warn-t.fold .wfold{transform:none}
.wst-ok{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--text) 18%,transparent);background:transparent;display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:800}
.wst-ok:hover,.wst-ok:focus-visible{border-color:var(--ok,#1f9d55);color:var(--ok,#1f9d55)}
.wchip{scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.4}
.wchip-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.wst{display:flex;flex-direction:column;gap:6px}
.wst-r{display:flex;align-items:center;gap:8px}
.wst-r .n{flex:1;min-width:0}
.cb.intro .cb-li{padding-left:0;margin-top:5px}.cb.intro .cb-li::before{content:none}
.rem-row{display:flex;flex-direction:column;gap:5px;margin:0 0 8px}
.rem{align-self:flex-start;border:0;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px 5px 8px;border-radius:999px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--text);cursor:pointer;text-align:left}
.rem b{font-variant-numeric:tabular-nums}.rem .rem-w{color:var(--muted);font-weight:500}
.rem.done{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.rem-done{display:flex;gap:4px;flex-wrap:wrap}
.rem-line{display:flex;align-items:center;gap:6px}
.rem-tick{flex:none;width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%;background:var(--surface);cursor:pointer;padding:0}
.rem-tick:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
html[data-style="bauhaus"] .rem-tick{border-radius:0;border:1px solid var(--line)}
.rem-ok{border:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);cursor:pointer;padding:0}
.rem-ok svg.i{width:13px;height:13px}
html[data-style="bauhaus"] .rem-ok{border-radius:0;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.day-rem{border:0;background:transparent;font-size:16px;width:34px;height:34px;border-radius:50%;cursor:pointer;opacity:.55;flex:none}
.day-rem:hover{opacity:1;background:var(--surface-2)}
.wst-go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:10px;margin:-4px;padding:4px}
.wst-go:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.stock.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--mecol),var(--shadow)}100%{box-shadow:var(--shadow)}}
.wst-r .n small{color:var(--muted);display:block;font-size:12px}
.wst-r.hi .n small{color:var(--danger);font-weight:600}
.today-t .tt-now{background:color-mix(in srgb,var(--mecol) 12%,var(--surface));border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.tt-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mecol)}
.tt-now b{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.2}
.tt-now span:last-child{font-size:12.5px;color:var(--muted)}
.tt-list{display:flex;flex-direction:column;gap:2px}
.tt-row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;box-shadow:inset 3px 0 0 var(--evc);background:color-mix(in srgb,var(--evc) 6%,transparent);font-size:13.5px}
.tt-row.past{opacity:.45}
.tt-time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--evc);font-size:12.5px}
.tt-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tt-dots{display:flex}
.tt-dots em{width:8px;height:8px;border-radius:50%;margin-left:-2px;box-shadow:0 0 0 1.5px var(--surface)}
.tt-tom{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.tt-tom .lbl{margin-right:4px}
.pill-ev{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--evc) 14%,var(--surface))}
.one-t{background:color-mix(in srgb,var(--mecol) 8%,var(--surface))}
.one-b{display:flex;align-items:center;gap:12px;margin-top:auto}
.one-b .ot-e{width:48px;height:48px;font-size:30px}
.food-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.food-d{border:0;background:var(--surface-2);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .12s}
.food-d:active{transform:scale(.96)}
.food-d b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdown-t{flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--evc) 24%,var(--surface)),color-mix(in srgb,var(--evc) 6%,var(--surface)))}
.mach-t .mach-mini{display:flex;flex-direction:column;gap:8px}
.mach-t .mach{box-shadow:none;background:var(--surface-2);padding:8px 10px}
.up-t .list .li{padding:8px 2px}
/* nav met 6 */
.nav button{min-width:0;overflow:hidden}
.nav button>span:not(.pill),.nav button{text-overflow:ellipsis;white-space:nowrap}
@media (max-width:440px){.nav button{font-size:10.5px;letter-spacing:0}.nav button .pill{width:44px}.seg button{padding:7px 10px;font-size:13px}}
/* schoolmenu */
.sm-up{display:flex;align-items:center;gap:14px;cursor:pointer;border:2px dashed var(--line);box-shadow:none;transition:border-color .2s,background .2s}
.sm-up:hover{border-color:var(--mecol);background:color-mix(in srgb,var(--mecol) 5%,var(--surface))}
.sm-up.busy{pointer-events:none;opacity:.8}
.sm-up-e{font-size:32px}
.sm-up-b{display:flex;flex-direction:column;gap:2px}
.sm-up-b span{font-size:13px;color:var(--muted)}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sm-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;min-width:0}
.sm-card.today{box-shadow:inset 0 0 0 2px var(--mecol),var(--shadow)}
.sm-card.past{opacity:.5}
.sm-d{display:flex;flex-direction:column;align-items:center;width:30px;flex:none;line-height:1.1}
.sm-d b{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.sm-d span{font-family:var(--f-display);font-size:20px;font-weight:600}
.sm-b{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12.5px;color:var(--muted)}
.sm-b b{font-size:13.5px;color:var(--ink);line-height:1.25}
.sm-list{display:flex;flex-direction:column;gap:8px}
.sm-row{display:flex;gap:10px;align-items:flex-start;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sm-row:last-child{border-bottom:0}
.sm-in{display:grid;grid-template-columns:1fr;gap:6px;flex:1;min-width:0}
@media (min-width:700px){.sm-in{grid-template-columns:1fr 1.6fr 1fr}}
.sm-in .in{min-height:38px;padding:6px 10px}
.food-school{border:0;text-align:left;background:color-mix(in srgb,var(--c-abel) 12%,var(--surface));border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
/* opvang */
.care-e{font-size:22px;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--surface-2);flex:none}
.sel{user-select:all}
/* weer */
.wx-chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c-ruben) 10%,var(--surface));color:var(--ink);white-space:nowrap}
.wx-chip.wet{background:color-mix(in srgb,var(--c-ruben) 22%,var(--surface))}
.wx-t{background:linear-gradient(160deg,color-mix(in srgb,var(--c-ruben) 16%,var(--surface)),var(--surface))}
.wx-now{display:flex;align-items:center;gap:12px;margin-top:auto}
.wx-big{font-size:44px;line-height:1}
.wx-now>div:nth-child(2){display:flex;flex-direction:column;flex:1;min-width:0}
.wx-now b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.wx-now span{font-size:12.5px;color:var(--muted)}
.wx-tom{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.wx-tom b{font-size:16px!important}
.wx-hrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.wx-hrs span{display:flex;flex-direction:column;align-items:center;font-size:16px;background:var(--surface);border-radius:10px;padding:4px 0}
.wx-hrs i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.wx-hrs b{font-size:12px}
.wx-li .wx-d{width:64px;font-weight:700;text-transform:capitalize;flex:none}
.wx-li .wx-e{font-size:24px}
.fwx{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c-ruben) 10%,var(--surface));font-size:14px;margin-bottom:8px}
/* maand inklappen */
.day-nav{gap:6px}
.day-nav .icon-btn{background:var(--surface-2);flex:none}
.day-nav .dn{min-width:0;min-height:2.5em;display:flex;align-items:center}
.ag-split{display:flex;flex-direction:column;gap:14px;overflow-x:clip;overflow-clip-margin:6px}
@media (min-width:900px){.ag-split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}}
.mc-bar{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.ag-mnav .mc-toggle{margin-left:10px;flex:none}
.mc-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;margin-bottom:-6px}
.mc-foot .today-btn{margin-left:0;width:32px;height:34px}
.mc-up{border:0;width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.mc-up svg.i{transform:rotate(-90deg);width:20px;height:20px;transition:transform .2s}
.mc-up.down svg.i{transform:rotate(90deg)}
.mc-up:hover{background:color-mix(in srgb,var(--text) 12%,var(--surface-2))}
.ag-mnav .ag-title{white-space:nowrap}
@media (max-width:480px){.ag-mnav .ag-title{font-size:19px}.ag-mnav .mc-toggle{margin-left:8px;padding:6px 10px;font-size:12.5px}.ag-mnav .icon-btn.sm{width:30px}}
.today-btn{flex:none;margin-left:6px;width:30px;height:32px;border:1.5px solid var(--muted);border-radius:7px;background:var(--surface);display:flex;flex-direction:column;align-items:stretch;padding:0;overflow:hidden;cursor:pointer;color:var(--text)}
.today-btn i{height:7px;background:var(--danger)}
.today-btn b{flex:1;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.today-btn:hover{border-color:var(--text)}
.mc-toggle{border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.mc-toggle span{font-size:11px}

.mgrid.coll .mcell{min-height:58px}
/* instellingen-tabs */
.set-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.set-layout>.set-grid{min-width:0}
.stabs{display:flex;flex-direction:column;gap:6px;padding:2px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:6}
.stab{border:0;border-radius:14px;background:var(--surface-2);padding:11px 14px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;text-align:left;color:var(--muted);transition:background .15s,color .15s}
.stab>span{font-size:18px}
@media (max-width:640px){.set-layout{grid-template-columns:72px minmax(0,1fr);gap:10px}.stab{flex-direction:column;gap:3px;padding:9px 4px;font-size:11px;text-align:center;justify-content:center}.stab>span{font-size:20px}}
.stab[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.set-grid.one{grid-template-columns:1fr!important;max-width:760px}
.set-fold summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:18px;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.set-fold summary::-webkit-details-marker{display:none}
.set-fold summary::before{content:"▸";font-size:14px;transition:transform .2s}
.set-fold[open] summary::before{transform:rotate(90deg)}
.set-fold summary .muted{font-family:var(--f-body);font-size:13px;font-weight:500}
.set-fold[open]>summary{margin-bottom:12px}
#s-fam details>h2{display:none}
/* recipes */
.rec-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.rcard{border:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.rcard h3{font-size:17px}
.menu-day{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.menu-day:last-child{border-bottom:0}
.menu-day .d{width:52px;flex:none}
.menu-day .d b{display:block;font-family:var(--f-display);font-size:17px;text-transform:capitalize}
.menu-day .d span{font-size:12px;color:var(--muted)}
.menu-day .m{flex:1;min-width:0;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;min-height:46px}
.menu-day .m.set{border-style:solid;border-color:transparent;background:var(--surface-2)}
.menu-day .m .s{display:block;font-size:12px;color:var(--muted);font-weight:500}
.menu-day.today .d b{color:var(--mecol)}

/* rugzak */
.kidhero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:color-mix(in srgb,var(--kc) 14%,var(--surface));border-radius:24px;padding:18px}
.jar{width:84px;height:104px;position:relative}
.jar svg{width:100%;height:100%;overflow:visible}
.kidhero .stars{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;color:var(--kc)}
.lvlbar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--kc) 20%,var(--surface));overflow:hidden;margin-top:8px}
.lvlbar i{display:block;height:100%;background:var(--kc);border-radius:5px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.sitem{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sitem .head{display:flex;gap:12px;align-items:flex-start}
.count{flex:none;width:66px;height:66px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc);text-align:center;line-height:1.05}
.count b{font-family:var(--f-display);font-size:26px;font-weight:600}
.count span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.count.hot{background:var(--kc);color:#fff}
.sitem h3{font-size:18px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;border:0;background:var(--surface-2);border-radius:12px;padding:8px 10px;text-align:left;font-weight:500;min-height:44px}
.step .st{width:26px;height:26px;flex:none;color:var(--line)}
.step.on{background:color-mix(in srgb,var(--kc) 14%,var(--surface))}
.step.on .st{color:var(--kc)}
.step.on span{text-decoration:line-through;color:var(--muted)}
.rocket{height:8px;border-radius:4px;background:var(--surface-2);position:relative}
.rocket i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--kc);transition:width .5s}
.typepill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc)}
.floatstar{position:fixed;z-index:80;pointer-events:none;color:#F5B400;animation:fs 900ms ease-out forwards}
@keyframes fs{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}60%{transform:translate(-50%,-140%) scale(1.4);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}

/* fab */
.fab{position:fixed;z-index:24;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 24px rgba(21,27,49,.25)}
.fab svg.i{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
[hidden]{display:none!important}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,14,28,.45);animation:fade .2s}
#sheet .panel{position:relative;background:var(--surface);width:100%;max-width:620px;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:24px;max-height:86%}}
#sheet header{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 20px}
#sheet header h2{font-size:21px;flex:1}
.sheet-body{overflow-y:auto;padding:8px 20px 18px;overscroll-behavior:contain}
#sheet footer{display:flex;gap:10px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.ing-row{display:grid;grid-template-columns:1fr 84px 34px;gap:6px;align-items:center}
.ing-row .ing-store{grid-column:1/3}
@media (min-width:560px){.ing-row{grid-template-columns:1fr 90px 130px 34px}.ing-row .ing-store{grid-column:auto}}
.ing-list{display:flex;flex-direction:column;gap:10px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.pick-list button{border:0;background:var(--surface-2);border-radius:12px;padding:11px 14px;text-align:left;font-weight:600}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{border:0;background:var(--surface-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-weight:700;text-align:left}
.qa button .s{font-weight:500;font-size:13px;color:var(--muted)}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:26px;text-align:center}
.login h1{font-size:clamp(30px,7vw,44px)}
.who{display:grid;grid-template-columns:repeat(2,minmax(130px,170px));gap:14px}
@media (min-width:700px){.who{grid-template-columns:repeat(4,170px)}}
.who button{border:0;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:17px;transition:transform .15s}
.who button:hover{transform:translateY(-3px)}
.who .av{--s:74px;box-shadow:none}
.who small{font-weight:500;color:var(--muted);font-size:13px}
.baby{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keypad button{height:62px;border-radius:20px;border:0;background:var(--surface-2);font-family:var(--f-display);font-size:24px;font-weight:600}

/* toasts & notifs */
.toasts{position:fixed;z-index:70;left:0;right:0;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:11px 16px;font-weight:600;max-width:460px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s;display:flex;gap:10px;align-items:center}
.nitem{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.nitem .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.nitem .tm{font-size:12px;color:var(--muted)}
.nitem.unread .tx{font-weight:600}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:14px;padding:10px 14px;font-size:13.5px;margin:6px 0 4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===================== Strak thema (Apple-stijl) — enkel uitzicht ===================== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#EDEDF2; --ink:#1C1C1E; --text:var(--ink); --muted:#8A8A8E; --line:rgba(60,60,67,.13);
  --primary:#007AFF; --on-primary:#FFFFFF; --danger:#FF3B30; --ok:#34C759; --warn:#FF9500;
  --c-charlotte:#FF375F; --c-ruben:#0A84FF; --c-nant:#FF9F0A; --c-abel:#30B455; --c-max:#AF52DE; --c-all:#8E8E93;
  --f-display:"TBEmoji",-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --f-body:"TBEmoji",-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --r:14px; --shadow:0 0 0 .5px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.035);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#FFFFFF; --muted:#8E8E93; --line:rgba(84,84,88,.6);
  --primary:#0A84FF; --on-primary:#FFFFFF; --danger:#FF453A; --ok:#30D158; --warn:#FF9F0A;
  --c-charlotte:#FF375F; --c-ruben:#0A84FF; --c-nant:#FF9F0A; --c-abel:#30D158; --c-max:#BF5AF2; --c-all:#98989D; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#FFFFFF; --muted:#8E8E93; --line:rgba(84,84,88,.6);
  --primary:#0A84FF; --on-primary:#FFFFFF; --danger:#FF453A; --ok:#30D158; --warn:#FF9F0A;
  --c-charlotte:#FF375F; --c-ruben:#0A84FF; --c-nant:#FF9F0A; --c-abel:#30D158; --c-max:#BF5AF2; --c-all:#98989D; --shadow:none}

body{font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:700;letter-spacing:-.022em}
/* balk bovenaan en tabbalk: doorschijnend met blur, haarlijntjes */
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top .brand{font-weight:700;letter-spacing:-.02em}
.nav{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);border-right-width:.5px}
.nav button{font-weight:500;font-size:10.5px;letter-spacing:0}
.nav button .pill{background:none!important;width:auto;height:28px;transform:none!important}
.nav button[aria-current="page"],.nav button[aria-current="page"] .pill{color:var(--primary)}
/* grote titel */
.hello{padding-block:6px 14px}
.hello h1{font-size:clamp(30px,7.5vw,38px);font-weight:700;letter-spacing:-.03em}
.hello h1 em{color:var(--ink)}
.hello .date{font-size:15px;font-weight:500}
/* kaarten: wit, zacht, geen kleurvlakken */
.card{border-radius:var(--r);box-shadow:var(--shadow)}
.bento{gap:10px}
.bt{border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 12px}
.bt.soon-t,.one-t,.wx-t{background:var(--surface)}
.bt.alert{box-shadow:var(--shadow)}
.warn-t{background:var(--surface);box-shadow:var(--shadow)}
.wchip{background:var(--bg);border-radius:12px}
.bt-ic{width:28px;height:28px;border-radius:8px;font-size:15px}
.bt-l{font-weight:600;font-size:15px;letter-spacing:-.01em}
.bt-go{opacity:.35}
/* weekstrook */
.wd2{border-radius:14px;box-shadow:var(--shadow);padding:11px 10px 10px}
.wd2-top b{font-weight:700;font-size:16px;letter-spacing:-.02em}
.wd2-n,.wd2-more,.wd2-free{font-weight:500}
.wd2-meal{border-top:.5px solid var(--line)}
.wk2-h h2,.bt .wk2-h h2{font-size:20px;letter-spacing:-.02em}
/* knoppen: iOS-stijl */
.btn{font-weight:600;letter-spacing:-.01em;min-height:40px;padding:9px 16px}
.btn:not(.primary):not(.danger){color:var(--primary);background:var(--surface-2)}
.btn.ghost:not(.danger){background:transparent}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.sm{min-height:32px;font-size:13.5px}
.icon-btn{color:var(--primary)}
.top .icon-btn{color:var(--primary)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
/* velden en chips: gevuld, zonder randen */
.in{border:0;background:var(--surface-2);border-radius:10px}
.in:focus{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:0}
.chip{border:0;background:var(--surface-2);font-weight:500;min-height:34px;padding:6px 13px}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--cc,var(--primary)) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--cc,var(--primary));color:var(--ink)}
.seg{background:var(--surface-2);border-radius:9px;padding:2px}
.seg button{border-radius:7px;font-weight:500}
.seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{font-weight:600}
/* tabbladen links in instellingen */
.stab{border-radius:10px;font-weight:500;background:transparent}
.stab[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
/* sheets */
#sheet .scrim{background:rgba(0,0,0,.32)}
#sheet .panel{border-radius:14px 14px 0 0}

/* agenda */
.ev{border-radius:12px;background:color-mix(in srgb,var(--evc) 9%,var(--surface))}
.ev .title{font-weight:600}
.mcell{box-shadow:var(--shadow);border-radius:11px}

.day-h .today-tag{background:var(--danger);color:#fff}
.wkc.is-today{box-shadow:inset 0 0 0 1.5px var(--danger),var(--shadow)}
.rt{background:var(--bg)}
.card .rt{background:var(--surface-2)}
.mc-up{background:var(--surface);box-shadow:var(--shadow);color:var(--primary)}
.today-btn{border-color:var(--line)}
