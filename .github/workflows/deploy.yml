# Stap 1 — Controle: bij elke wijziging op "test" of "main" wordt de app gecontroleerd.
name: Controle
on:
  push:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Code geldig?
        run: node tests/check.mjs
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: App start en alle schermen werken?
        run: node tests/smoke.mjs
