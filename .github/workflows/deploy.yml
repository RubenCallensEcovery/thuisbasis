# Stap 1 — Controle: bij elke wijziging op "test" of "main" wordt de app gecontroleerd.
name: Controle
on:
  push:
    branches: [main, test]
    # enkel de Android-app (Planner) gewijzigd? dan verandert er niets aan de webapp: geen controle nodig
    paths-ignore: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Code geldig?
        run: node tests/check.mjs
      - name: Testbrowser installeren (tot 3 pogingen)
        run: |
          npm i --no-save playwright@1.47.2
          # de systeembibliotheken staan al op de GitHub-server; enkel de browser zelf ophalen (geen apt, dus geen last van storingen bij Ubuntu)
          for i in 1 2 3; do npx playwright install chromium && exit 0; echo "poging $i mislukt, opnieuw over 30 s"; sleep 30; done
          exit 1
      - name: App start en alle schermen werken?
        run: node tests/smoke.mjs
